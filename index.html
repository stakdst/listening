<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Listening</title>
<script>
  try {
    var savedPrefs = JSON.parse(localStorage.getItem('listeningMaker.prefs.v1'));
    if (savedPrefs && (savedPrefs.theme === 'light' || savedPrefs.theme === 'dark')) {
      document.documentElement.setAttribute('data-theme', savedPrefs.theme);
    }
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f2f7;
    --bg-top: #f9f9fb;
    --text: rgba(0, 0, 0, 0.88);
    --sub: rgba(60, 60, 67, 0.62);
    --faint: rgba(60, 60, 67, 0.36);
    --glass: rgba(255, 255, 255, 0.74);
    --glass-strong: rgba(255, 255, 255, 0.92);
    --glass-player: rgba(250, 250, 252, 0.70);
    --field: rgba(118, 118, 128, 0.07);
    --hairline: rgba(0, 0, 0, 0.07);
    --rim-1: rgba(255, 255, 255, 1);
    --rim-2: rgba(255, 255, 255, 0.35);
    --inner-hl: rgba(255, 255, 255, 0.9);
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-float: 0 18px 50px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.06);
    --accent: #007aff;
    --accent-soft: rgba(0, 122, 255, 0.11);
    --danger: #ff3b30;
    --danger-soft: rgba(255, 59, 48, 0.11);
    --seg-bg: rgba(118, 118, 128, 0.12);
    --thumb: #ffffff;
    --track: rgba(0, 0, 0, 0.10);
    --ease: cubic-bezier(0.3, 0.7, 0.2, 1);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --bg-top: #0c0c0e;
    --text: rgba(255, 255, 255, 0.92);
    --sub: rgba(235, 235, 245, 0.60);
    --faint: rgba(235, 235, 245, 0.32);
    --glass: rgba(28, 28, 30, 0.74);
    --glass-strong: rgba(58, 58, 60, 0.72);
    --glass-player: rgba(36, 36, 38, 0.64);
    --field: rgba(118, 118, 128, 0.14);
    --hairline: rgba(255, 255, 255, 0.08);
    --rim-1: rgba(255, 255, 255, 0.22);
    --rim-2: rgba(255, 255, 255, 0.04);
    --inner-hl: rgba(255, 255, 255, 0.08);
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-float: 0 18px 50px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.20);
    --danger: #ff453a;
    --danger-soft: rgba(255, 69, 58, 0.16);
    --seg-bg: rgba(118, 118, 128, 0.24);
    --thumb: #636366;
    --track: rgba(255, 255, 255, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000;
      --bg-top: #0c0c0e;
      --text: rgba(255, 255, 255, 0.92);
      --sub: rgba(235, 235, 245, 0.60);
      --faint: rgba(235, 235, 245, 0.32);
      --glass: rgba(28, 28, 30, 0.74);
      --glass-strong: rgba(58, 58, 60, 0.72);
      --glass-player: rgba(36, 36, 38, 0.64);
      --field: rgba(118, 118, 128, 0.14);
      --hairline: rgba(255, 255, 255, 0.08);
      --rim-1: rgba(255, 255, 255, 0.22);
      --rim-2: rgba(255, 255, 255, 0.04);
      --inner-hl: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-float: 0 18px 50px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.20);
      --danger: #ff453a;
      --danger-soft: rgba(255, 69, 58, 0.16);
      --seg-bg: rgba(118, 118, 128, 0.24);
      --thumb: #636366;
      --track: rgba(255, 255, 255, 0.14);
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--bg); }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
  }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 60%);
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  button:disabled { cursor: default; opacity: 0.38; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  svg { display: block; }

  .hidden { display: none !important; }

  /* ---------- ガラス ---------- */
  .glass {
    position: relative;
    background: var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border-radius: 26px;
    box-shadow: var(--shadow), inset 0 1px 0 var(--inner-hl);
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg, var(--rim-1), var(--rim-2) 30%, transparent 55%, var(--rim-2) 85%, var(--rim-1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }

  /* ---------- レイアウト ---------- */
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    display: grid;
    gap: 30px;
    transition: padding-bottom 0.4s var(--ease);
  }

  body.has-player main { padding-bottom: calc(320px + env(safe-area-inset-bottom)); }

  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 4px 0;
  }

  .hero h1 {
    margin: 0;
    font-size: 2.125rem;
    font-weight: 700;
    letter-spacing: -0.022em;
  }

  .round-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
    color: var(--text);
  }

  .round-btn svg { width: 20px; height: 20px; }

  .card { padding: 20px; }

  .link {
    color: var(--accent);
    font-size: 0.95rem;
    padding: 4px 2px;
  }

  .notice {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 0.9rem;
  }

  /* ---------- 入力 ---------- */
  .field {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--hairline);
    border-radius: 14px;
    background: var(--field);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    transition: border-color 0.2s, background-color 0.3s;
  }

  .field::placeholder { color: var(--faint); }

  .field:focus {
    outline: none;
    border-color: var(--accent);
  }

  .stack { display: grid; gap: 10px; }

  .textwrap { position: relative; }

  textarea.field {
    display: block;
    min-height: 176px;
    padding-bottom: 56px;
    resize: vertical;
    line-height: 1.6;
  }

  .textwrap.recording textarea.field { border-color: var(--danger); }

  .mic {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--glass-strong);
    color: var(--text);
    box-shadow: inset 0 1px 0 var(--inner-hl), 0 1px 3px rgba(0, 0, 0, 0.12);
    transition: background-color 0.2s, color 0.2s;
  }

  .mic svg { width: 20px; height: 20px; }

  .mic.recording {
    background: var(--danger);
    color: #fff;
  }

  .mic.recording::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--danger);
    animation: ring 1.4s ease-out infinite;
    pointer-events: none;
  }

  @keyframes ring {
    from { opacity: 0.6; transform: scale(0.9); }
    to { opacity: 0; transform: scale(1.5); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .countline {
    min-height: 1.3em;
    margin: -2px 4px 0;
    font-size: 0.8rem;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }

  .countline.recording { color: var(--danger); }

  .voice-row {
    display: grid;
    grid-template-columns: 120px 1fr 40px;
    gap: 10px;
    align-items: center;
  }

  .select-wrap { position: relative; }

  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 36px;
    height: 40px;
    padding-top: 0;
    padding-bottom: 0;
    cursor: pointer;
  }

  .select-wrap svg {
    position: absolute;
    right: 12px;
    top: 50%;
    width: 14px;
    height: 14px;
    transform: translateY(-50%) rotate(90deg);
    color: var(--sub);
    pointer-events: none;
  }

  .sample-btn {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--field);
    border: 1px solid var(--hairline);
    color: var(--text);
  }

  .sample-btn svg { width: 19px; height: 19px; }

  .sample-btn.busy { color: var(--faint); }

  .sample-btn.busy::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }

  /* ---------- セグメント ---------- */
  .segmented {
    position: relative;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    padding: 3px;
    border-radius: 12px;
    background: var(--seg-bg);
  }

  .segmented button {
    position: relative;
    z-index: 1;
    height: 34px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--sub);
    transition: color 0.25s;
  }

  .segmented button[aria-pressed="true"] { color: var(--text); }

  .segmented.small button { height: 28px; font-size: 0.84rem; }

  .seg-thumb {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc((100% - 6px) / var(--n, 2));
    transform: translateX(calc(100% * var(--i, 0)));
    border-radius: 9px;
    background: var(--thumb);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04), inset 0 1px 0 var(--inner-hl);
    transition: transform 0.34s var(--ease), background-color 0.3s;
  }

  /* ---------- 再生設定 ---------- */
  .settings {
    border-radius: 14px;
    background: var(--field);
  }

  .settings summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    list-style: none;
    cursor: pointer;
    font-size: 0.95rem;
    -webkit-tap-highlight-color: transparent;
  }

  .settings summary::-webkit-details-marker { display: none; }

  .settings summary .summary-value {
    margin-left: auto;
    color: var(--sub);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }

  .settings summary svg {
    width: 14px;
    height: 14px;
    color: var(--sub);
    transition: transform 0.25s var(--ease);
  }

  .settings[open] summary svg { transform: rotate(90deg); }

  .settings-body {
    display: grid;
    gap: 16px;
    padding: 4px 14px 16px;
  }

  .setting-head {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
  }

  .setting-head output {
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }

  .setting-inline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .setting-inline .segmented { width: 200px; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }

  input[type="range"]:focus { outline: none; }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--track) var(--p, 50%));
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px;
    height: 26px;
    margin-top: -11px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 4px;
    background: var(--track);
  }

  input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 4px;
    background: var(--accent);
  }

  input[type="range"]::-moz-range-thumb {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
  }

  .switch {
    position: relative;
    width: 51px;
    height: 31px;
    flex: none;
  }

  .switch input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .switch span {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--track);
    transition: background-color 0.25s;
    pointer-events: none;
  }

  .switch span::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
    transition: transform 0.3s var(--ease);
  }

  .switch input:checked + span { background: #34c759; }

  .switch input:checked + span::after { transform: translateX(20px); }

  /* ---------- 音声エンジンの状態 ---------- */
  .engine {
    display: grid;
    gap: 6px;
    margin: 0 4px;
    font-size: 0.8rem;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }

  .engine.error { color: var(--danger); }

  .engine-bar {
    height: 3px;
    border-radius: 2px;
    background: var(--track);
    overflow: hidden;
  }

  .engine-bar i {
    display: block;
    height: 100%;
    width: calc(var(--p, 0) * 100%);
    background: var(--accent);
    transition: width 0.3s var(--ease);
  }

  .engine.no-bar .engine-bar { display: none; }

  /* ---------- ボタン ---------- */
  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }

  .actions .link { margin-right: auto; padding: 4px 6px; }

  .btn {
    height: 44px;
    min-width: 96px;
    padding: 0 22px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    background: var(--seg-bg);
    transition: background-color 0.2s, opacity 0.2s;
  }

  .btn.primary {
    background: var(--accent);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 6px 18px color-mix(in srgb, var(--accent) 28%, transparent);
  }

  /* ---------- ライブラリ ---------- */
  .search {
    margin-bottom: 18px;
    height: 40px;
    padding-top: 0;
    padding-bottom: 0;
  }

  .library {
    display: grid;
    gap: 24px;
  }

  .group-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 6px 8px;
  }

  .group-date {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .group-rel {
    font-size: 0.82rem;
    color: var(--sub);
  }

  .group-count {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .list { overflow: hidden; }

  .item {
    position: relative;
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    padding: 14px 12px 14px 16px;
    transition: background-color 0.2s;
  }

  .item + .item::after {
    content: "";
    position: absolute;
    top: 0;
    left: 74px;
    right: 0;
    height: 1px;
    background: var(--hairline);
  }

  .item.editing { background: var(--accent-soft); }

  .item-play {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    transition: background-color 0.2s, color 0.2s;
  }

  .item-play svg { width: 18px; height: 18px; }

  .item.playing .item-play {
    background: var(--accent);
    color: #fff;
  }

  .item-play.gen {
    background: transparent;
    color: var(--faint);
    cursor: default;
  }

  .item-play.gen::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--pg, 0) * 1turn), var(--track) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
    transition: background 0.3s;
  }

  .item-play.failed {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .item-body { min-width: 0; }

  .item-head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .item-title {
    min-width: 0;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tag {
    flex: none;
    padding: 0 6px;
    border-radius: 6px;
    background: var(--seg-bg);
    color: var(--sub);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.6;
  }

  .item-snippet {
    font-size: 0.88rem;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-meta {
    margin-top: 2px;
    font-size: 0.76rem;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .item-meta .st-gen { color: var(--accent); }

  .item-meta .st-fail { color: var(--danger); }

  .item-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .item:hover .item-actions,
  .item:focus-within .item-actions,
  .item.editing .item-actions { opacity: 1; }

  @media (hover: none) {
    .item-actions { opacity: 1; }
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--sub);
    transition: background-color 0.2s, color 0.2s;
  }

  .icon-btn svg { width: 18px; height: 18px; }

  .icon-btn:hover { background: var(--seg-bg); color: var(--text); }

  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }

  .empty {
    padding: 36px 20px;
    text-align: center;
    color: var(--sub);
    font-size: 0.92rem;
  }

  /* ---------- プレーヤー ---------- */
  .player {
    position: fixed;
    left: 50%;
    bottom: calc(12px + env(safe-area-inset-bottom));
    width: min(640px, calc(100% - 24px));
    padding: 16px 20px 18px;
    border-radius: 32px;
    background: var(--glass-player);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    backdrop-filter: blur(40px) saturate(200%);
    box-shadow: var(--shadow-float), inset 0 1px 0 var(--inner-hl);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 24px);
    transition: opacity 0.35s var(--ease), transform 0.45s var(--ease);
  }

  .player.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }

  .p-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: -8px;
  }

  .p-title {
    flex: 1;
    min-width: 0;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .p-progress {

<script>
// 音声合成エンジン（Kokoro）。Web Worker 内で動かし、使えない環境では画面側で動かす
function engineMain(port) {
  const LIBS = [
    'https://cdn.jsdelivr.net/npm/kokoro-js@1/dist/kokoro.web.js',
    'https://cdn.jsdelivr.net/npm/kokoro-js@1/+esm'
  ];
  const MODEL = 'onnx-community/Kokoro-82M-v1.0-ONNX';
  let ttsPromise = null;

  async function importLib() {
    let lastErr = null;
    for (const url of LIBS) {
      try {
        const mod = await import(url);
        if (mod && mod.KokoroTTS) return mod.KokoroTTS;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('音声エンジンを読み込めませんでした');
  }

  async function load(device) {
    const KokoroTTS = await importLib();
    const files = {};
    const progress_callback = (p) => {
      if (p && p.status === 'progress' && p.file) {
        files[p.file] = { loaded: p.loaded || 0, total: p.total || 0 };
        let loaded = 0;
        let total = 0;
        for (const k in files) {
          loaded += files[k].loaded;
          total += files[k].total;
        }
        port.postMessage({ type: 'progress', loaded, total });
      }
    };
    let tts = null;
    if (device === 'webgpu') {
      try {
        tts = await KokoroTTS.from_pretrained(MODEL, { dtype: 'fp32', device: 'webgpu', progress_callback });
      } catch (e) {
        tts = null;
      }
    }
    if (!tts) {
      tts = await KokoroTTS.from_pretrained(MODEL, { dtype: 'q8', device: 'wasm', progress_callback });
    }
    port.postMessage({ type: 'ready' });
    return tts;
  }

  function getTTS(device) {
    if (!ttsPromise) {
      ttsPromise = load(device).catch((e) => {
        ttsPromise = null;
        throw e;
      });
    }
    return ttsPromise;
  }

  port.onmessage = async (e) => {
    const m = e.data;
    if (m.type !== 'gen') return;
    try {
      const tts = await getTTS(m.device);
      const parts = [];
      let sr = 24000;
      for (const chunk of m.chunks) {
        const out = await tts.generate(chunk, { voice: m.voice, speed: 1 });
        parts.push(out.audio);
        sr = out.sampling_rate || sr;
      }
      const gap = Math.round(sr * 0.15);
      const length = parts.reduce((n, p) => n + p.length, 0) + gap * (parts.length - 1);
      const pcm = new Float32Array(length);
      let offset = 0;
      parts.forEach((p, i) => {
        pcm.set(p, offset);
        offset += p.length + (i < parts.length - 1 ? gap : 0);
      });
      port.postMessage({ type: 'done', id: m.id, pcm, sr }, [pcm.buffer]);
    } catch (err) {
      port.postMessage({ type: 'error', id: m.id, message: String((err && err.message) || err) });
    }
  };
}

  const THEMES = ['system', 'light', 'dark'];
  const THEME_LABEL = { system: '自動', light: 'ライト', dark: 'ダーク' };
  const MODES = ['follow', 'all', 'hide'];
  const MODE_LABEL = { follow: '声に合わせる', all: '常に表示', hide: '隠す' };
  const RATES = [0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.3];
  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
  const ABBR = /\b(?:Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|e\.g|i\.e)\.$/i;

  // 品質の高い、ふつうの大人の話し声だけを選んでいる（ささやき声・キャラクター声は含めない）
  const VOICES = {
    US: [
      { id: 'af_heart', label: '女性 · 温かい' },
      { id: 'af_bella', label: '女性 · 明るい' },
      { id: 'af_sarah', label: '女性 · 落ち着いた' },
      { id: 'af_kore', label: '女性 · はきはき' },
      { id: 'af_aoede', label: '女性 · やわらか' },
      { id: 'am_michael', label: '男性 · 落ち着いた' },
      { id: 'am_fenrir', label: '男性 · 力強い' },
      { id: 'am_puck', label: '男性 · 快活' }
    ],
    UK: [
      { id: 'bf_emma', label: '女性 · 上品' },
      { id: 'bf_isabella', label: '女性 · やわらか' },
      { id: 'bm_george', label: '男性 · 低め' },

    ]
  };

  function isVoice(id) {
    return VOICES.US.some((v) => v.id === id) || VOICES.UK.some((v) => v.id === id);
  }

  function accentOfVoice(id) {
    return VOICES.UK.some((v) => v.id === id) ? 'UK' : 'US';
  }

  function defaultVoice(accent) {
    return VOICES[accent][0].id;
  }

  function voiceLabel(id) {
    const v = VOICES.US.concat(VOICES.UK).find((x) => x.id === id);
    return v ? v.label : '';
  }

  const DEFAULT_PREFS = {
    theme: 'system',
    accent: 'US',
    kvoice: { US: 'af_heart', UK: 'bf_emma' },
    rate: 1,
    pause: 1,
    repeat: 1,
    loop: false,
    display: 'follow'
  };

  // ---------- 保存（英文と設定） ----------
  function loadJSON(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  function loadPrefs() {
    const p = loadJSON(PREFS_KEY, {});
    const kv = { ...DEFAULT_PREFS.kvoice, ...(p.kvoice || {}) };
    if (!isVoice(kv.US) || accentOfVoice(kv.US) !== 'US') kv.US = DEFAULT_PREFS.kvoice.US;
    if (!isVoice(kv.UK) || accentOfVoice(kv.UK) !== 'UK') kv.UK = DEFAULT_PREFS.kvoice.UK;
    return {
      ...DEFAULT_PREFS,
      ...p,
      accent: p.accent === 'UK' ? 'UK' : 'US',
      kvoice: kv
    };
  }

  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        theme: prefs.theme,
        accent: prefs.accent,
        kvoice: prefs.kvoice,
        rate: prefs.rate,
        pause: prefs.pause,
        repeat: prefs.repeat,
        loop: prefs.loop,
        display: prefs.display
      }));
    } catch (e) {}
  }

  function clampNum(v, min, max, fallback) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function normalizeItem(i) {
    const s = i.settings || {};
    let accent;
    let voice;
    if (isVoice(s.voice)) {
      voice = s.voice;
      accent = accentOfVoice(voice);
    } else {
      accent = s.accent === 'UK' || s.accent === 'US'
        ? s.accent
        : (/(en-GB|\bUK\b|British)/i.test(s.voiceName || '') ? 'UK' : 'US');
      voice = defaultVoice(accent);
    }
    const created = Number(i.createdAt) || Date.now();
    return {
      id: String(i.id),
      text: String(i.text),
      settings: {
        accent,
        voice,
        rate: clampNum(s.rate, 0.5, 1.5, 1),
        pause: clampNum(s.pause, 0, 5, 1),
        repeat: [1, 2, 3, 5].includes(Number(s.repeat)) ? Number(s.repeat) : 1,
        loop: !!s.loop
      },
      createdAt: created,
      updatedAt: Number(i.updatedAt) || created,
      lastPlayedAt: Number(i.lastPlayedAt) || null,
      playCount: Number(i.playCount) || 0,
      playLog: Array.isArray(i.playLog)
        ? i.playLog.filter((e) => e && e.t).map((e) => ({ t: Number(e.t), r: Number(e.r) || 1 }))

  function loadItems() {

  function saveItems() {

  }

  const prefs = loadPrefs();
  let items = loadItems();
  let editingId = null;
  let formAccent = prefs.accent;
  let formRepeat = prefs.repeat;
  let formVoice = { ...prefs.kvoice };
  let lastDeleted = null;
  let accentSeg = null;
  let repeatSeg = null;
  let clipsLoaded = false;

  // ---------- 保存（音声） ----------
  const clips = new Map();
  let dbPromise = null;

  function db() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const r = indexedDB.open('listeningMaker', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('clips');
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }
    return dbPromise;
  }

  async function tx(mode, run) {
    const d = await db();
    return new Promise((resolve, reject) => {
      const t = d.transaction('clips', mode);
      run(t.objectStore('clips'));
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }

  function putClip(key, value) {
    return tx('readwrite', (st) => st.put(value, key));
  }

  function deleteClips(keys) {
    return tx('readwrite', (st) => keys.forEach((k) => st.delete(k)));
  }

  function loadAllClips() {
    return tx('readonly', (st) => {
      const req = st.openCursor();
      req.onsuccess = () => {
        const c = req.result;
        if (!c) return;
        const v = c.value;
        if (v && v.blob) clips.set(c.key, { url: URL.createObjectURL(v.blob), dur: Number(v.dur) || 0 });
        c.continue();
      };
    });
  }

  // ---------- ユーティリティ ----------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function truncate(s, n) {
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function fmtRate(r) {
    return Number(r).toFixed(2).replace(/0$/, '');
  }

  function splitSentences(text) {
    const cleaned = String(text).replace(/\s+/g, ' ').trim();
    if (!cleaned) return [];
    const parts = cleaned.split(/(?<=[.!?]["'”’)\]]*)\s+/);
    const out = [];
    parts.forEach((p) => {
      if (out.length && ABBR.test(out[out.length - 1])) {
        out[out.length - 1] += ' ' + p;
      } else {
        out.push(p);
      }
    });
    return out.filter(Boolean);
  }

  function firstSentence(text) {
    return splitSentences(text)[0] || String(text).trim();
  }

  function countWords(text) {
    const t = text.trim();
    return t ? t.split(/\s+/).length : 0;
  }

  function startOfDay(ts) {
    const d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }

  function daysAgo(ts) {
    return Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000);
  }

  function shortDate(ts) {
    const d = new Date(ts);
    const md = `${d.getMonth() + 1}/${d.getDate()}`;
    return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}/${md}`;
  }

  function relLabel(ts) {
    const diff = daysAgo(ts);
    if (diff <= 0) return '今日';
    if (diff === 1) return '昨日';
    if (diff < 7) return `${diff}日前`;
    return shortDate(ts);
  }

  function dayHeading(ts) {
    const d = new Date(ts);
    const md = `${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
    const date = d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}年${md}`;
    const diff = daysAgo(ts);
    let rel = '';
    if (diff === 0) rel = '今日';
    else if (diff === 1) rel = '昨日';
    else if (diff > 1 && diff < 7) rel = `${diff}日前`;
    return { date, rel };
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  let toastTimer = null;
  function toast(msg, action, duration) {
    const t = $('toast');
    t.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = msg;
    t.appendChild(span);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'link';
      b.textContent = action.label;
      b.addEventListener('click', () => {
        t.classList.remove('show');
        action.onClick();
      });
      t.appendChild(b);
    }
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration || 2400);
  }

  function showNotice(msg) {
    const n = $('notice');
    n.textContent = msg;
    n.classList.remove('hidden');
  }

  // ---------- 音声データの加工 ----------
  function trimSilence(pcm, sr) {
    const th = 0.008;
    let a = 0;
    let b = pcm.length - 1;
    while (a < pcm.length && Math.abs(pcm[a]) < th) a++;
    while (b > a && Math.abs(pcm[b]) < th) b--;
    if (a >= b) return pcm;
    const start = Math.max(0, a - Math.round(sr * LEAD));
    const end = Math.min(pcm.length, b + Math.round(sr * TAIL) + 1);
    return pcm.slice(start, end);
  }

  function normalizePeak(pcm) {
    let peak = 0;
    for (let i = 0; i < pcm.length; i++) {
      const v = Math.abs(pcm[i]);
      if (v > peak) peak = v;
    }
    if (peak > 0) {
      const gain = Math.min(3, 0.89 / peak);
      for (let i = 0; i < pcm.length; i++) pcm[i] *= gain;
    }
    return pcm;
  }

  function encodeWav(samples, sr) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const w = (o, s) => {
      for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
    };
    w(0, 'RIFF');
    v.setUint32(4, 36 + samples.length * 2, true);
    w(8, 'WAVE');
    w(12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);
    v.setUint16(22, 1, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true);
    v.setUint16(34, 16, true);
    w(36, 'data');
    v.setUint32(40, samples.length * 2, true);
    let o = 44;
    for (let i = 0; i < samples.length; i++, o += 2) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  let silentUrl = null;
  function silentURL() {
    if (!silentUrl) silentUrl = URL.createObjectURL(encodeWav(new Float32Array(1200), 24000));
    return silentUrl;
  }

  function chunkText(text) {
    if (text.length <= 280) return [text];
    const parts = text.split(/(?<=[,;:])\s+/);
    const out = [];
    let cur = '';
    parts.forEach((p) => {
      if (cur && (cur + ' ' + p).length > 280) {
        out.push(cur);
        cur = p;
      } else {
        cur = cur ? cur + ' ' + p : p;
      }
    });
    if (cur) out.push(cur);
    return out;
  }

  // ---------- 音声エンジンとの接続 ----------
  const gen = {
    queue: [],
    current: null,
    busy: false,
    engine: 'idle',
    load: null,
    failed: new Set(),
    waiters: new Map()
  };

  const engine = (() => {
    let port = null;
    let gotReply = false;
    let seq = 0;
    const backlog = [];
    const pending = new Map();

    function handle(e) {
      gotReply = true;
      const m = e.data;
      if (m.type === 'progress') {
        if (gen.engine !== 'ready') gen.engine = 'loading';
        gen.load = { loaded: m.loaded, total: m.total };
        renderEngine();
        return;
      }
      if (m.type === 'ready') {
        gen.engine = 'ready';
        renderEngine();
        return;
      }
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.type === 'done') {
        gen.engine = 'ready';
        p.resolve(m);
      } else {
        p.reject(new Error(m.message));
      }
    }

    function useMainThread() {
      const inner = { onmessage: null, postMessage: (d) => setTimeout(() => handle({ data: d }), 0) };
      engineMain(inner);
      port = { postMessage: (d) => inner.onmessage({ data: d }) };
      backlog.splice(0).forEach((msg) => port.postMessage(msg));
    }

    function start() {
      if (port) return;
      try {
        const src = `(${engineMain.toString()})(self);`;
        const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        const worker = new Worker(url, { type: 'module' });
        worker.onmessage = handle;
        worker.onerror = (ev) => {
          if (ev && ev.preventDefault) ev.preventDefault();
          if (!gotReply) {
            worker.terminate();
            useMainThread();
          }
        };
        port = worker;
      } catch (e) {
        useMainThread();
      }
    }

    function request(msg) {
      start();
      const id = ++seq;
      const full = { ...msg, id };
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        if (!gotReply) backlog.push(full);
        port.postMessage(full);
      });
    }

    return { request };
  })();

  function clipKey(voice, sentence) {
    return `${voice}|${sentence}`;
  }

  function isSampleKey(key) {
    return key.endsWith('|' + SAMPLE_TEXT);
  }

  function neededKeys(item) {
    return splitSentences(item.text).map((s) => clipKey(item.settings.voice, s));
  }

  function isNeeded(key) {
    if (isSampleKey(key)) return true;
    return items.some((i) => neededKeys(i).includes(key));
  }

  function itemStatus(item) {
    const keys = neededKeys(item);
    const have = keys.filter((k) => clips.has(k)).length;
    if (have === keys.length) return { ready: true, have, total: keys.length };
    const pendingKeys = keys.some((k) => k === gen.current || gen.queue.includes(k));
    const failed = !pendingKeys && keys.some((k) => gen.failed.has(k));
    return { ready: false, failed, active: keys.includes(gen.current), have, total: keys.length };
  }

  function enqueueKeys(keys, front) {
    if (!CAN_GENERATE) return;
    const missing = [...new Set(keys)].filter((k) => !clips.has(k) && k !== gen.current);
    if (!missing.length) return;
    missing.forEach((k) => gen.failed.delete(k));
    const rest = gen.queue.filter((k) => !missing.includes(k));
    gen.queue = front ? missing.concat(rest) : rest.concat(missing);
    if (gen.engine === 'idle' || gen.engine === 'error') gen.engine = 'loading';
    renderEngine();
    pump();
  }

  function enqueueItem(item, front) {
    enqueueKeys(neededKeys(item), front);
  }

  function settleWaiters(key, err) {
    const list = gen.waiters.get(key);
    if (!list) return;
    gen.waiters.delete(key);
    list.forEach((w) => (err ? w.reject(err) : w.resolve()));
  }

  function waitClip(key) {
    if (clips.has(key)) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const list = gen.waiters.get(key) || [];
      list.push({ resolve, reject });
      gen.waiters.set(key, list);
      enqueueKeys([key], true);
    });
  }

  async function pump() {
    if (gen.busy) return;
    let key;
    while ((key = gen.queue.shift()) !== undefined) {
      if (!clips.has(key) && isNeeded(key)) break;
    }
    if (key === undefined) {
      gen.current = null;
      renderEngine();
      return;
    }

    gen.busy = true;
    gen.current = key;
    renderEngine();
    renderList();

    try {
      const sep = key.indexOf('|');
      const res = await engine.request({
        type: 'gen',
        voice: key.slice(0, sep),
        chunks: chunkText(key.slice(sep + 1)),
        device: DEVICE
      });
      const pcm = normalizePeak(trimSilence(res.pcm, res.sr));
      const blob = encodeWav(pcm, res.sr);
      const dur = pcm.length / res.sr;
      try {
        await putClip(key, { blob, dur });
      } catch (e) {
        toast('音声を端末に保存できませんでした。保存容量を確認してください', null, 3600);
      }
      clips.set(key, { url: URL.createObjectURL(blob), dur });
      settleWaiters(key, null);
    } catch (err) {
      gen.failed.add(key);
      settleWaiters(key, err);
      if (gen.engine !== 'ready') {
        gen.engine = 'error';
        gen.queue.splice(0).forEach((k) => {
          gen.failed.add(k);
          settleWaiters(k, err);
        });
      }
    }

    gen.busy = false;
    gen.current = null;
    renderEngine();
    renderList();
    pump();
  }

  async function gc() {
    if (!clipsLoaded) return;
    const keep = new Set();
    const refs = lastDeleted ? items.concat([lastDeleted.item]) : items;
    refs.forEach((i) => neededKeys(i).forEach((k) => keep.add(k)));
    const drop = [...clips.keys()].filter((k) => !keep.has(k) && !isSampleKey(k));
    drop.forEach((k) => {
      URL.revokeObjectURL(clips.get(k).url);
      clips.delete(k);
    });
    if (drop.length) {
      try {
        await deleteClips(drop);
      } catch (e) {}
    }
  }

  function mb(n) {
    return Math.round(n / 1e6);
  }

  function renderEngine() {
    const el = $('engine');
    const bar = $('engineBar');
    let text = '';
    let pct = null;
    const remaining = gen.queue.filter((k) => !isSampleKey(k)).length
      + (gen.current && !isSampleKey(gen.current) ? 1 : 0);

    if (gen.engine === 'loading' && (gen.busy || gen.queue.length)) {
      const l = gen.load;
      if (l && l.total && l.loaded < l.total) {
        text = `音声エンジンを準備中（初回のみ） ${mb(l.loaded)} / ${mb(l.total)} MB`;
        pct = l.loaded / l.total;
      } else {
        text = '音声エンジンを準備中';
      }
    } else if (remaining > 0) {
      text = `音声を作成中 · 残り${remaining}文`;
    } else if (gen.engine === 'error') {
      text = '音声エンジンを読み込めませんでした。ネットワークに接続して、作成できなかった英文の再試行ボタンを押してください';
    }

    el.classList.toggle('hidden', !text);
    el.classList.toggle('error', gen.engine === 'error' && !remaining);
    el.classList.toggle('no-bar', pct === null);
    $('engineText').textContent = text;
    bar.style.setProperty('--p', pct === null ? 0 : pct.toFixed(3));
  }

  // ---------- テーマ ----------
  function applyTheme() {
    const root = document.documentElement;
    if (prefs.theme === 'system') {
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', prefs.theme);
    }
    const b = $('btnTheme');
    const icon = prefs.theme === 'system' ? 'auto' : prefs.theme === 'light' ? 'sun' : 'moon';
    b.innerHTML = ICON[icon];
    b.setAttribute('aria-label', `表示モード: ${THEME_LABEL[prefs.theme]}`);
    b.title = `表示モード: ${THEME_LABEL[prefs.theme]}`;
  }

  function cycleTheme() {
    prefs.theme = THEMES[(THEMES.indexOf(prefs.theme) + 1) % THEMES.length];
    savePrefs();
    applyTheme();
    toast(`表示モード: ${THEME_LABEL[prefs.theme]}`);
  }

  // ---------- セグメント ----------
  function setupSegmented(el, value, onChange) {
    const btns = [...el.querySelectorAll('button')];
    el.style.setProperty('--n', btns.length);
    const set = (v, emit) => {
      const i = Math.max(0, btns.findIndex((b) => b.dataset.value === String(v)));
      el.style.setProperty('--i', i);
      btns.forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
      if (emit) onChange(btns[i].dataset.value);
    };
    btns.forEach((b) => b.addEventListener('click', () => set(b.dataset.value, true)));
    set(value, false);
    return { set: (v) => set(v, false) };
  }

  // ---------- フォーム ----------
  function renderVoiceSelect() {
    const sel = $('voice');
    const list = VOICES[formAccent];
    sel.innerHTML = '';
    list.forEach((v) => sel.add(new Option(v.label, v.id)));
    const want = formVoice[formAccent];
    sel.value = list.some((v) => v.id === want) ? want : list[0].id;
  }

  function getFormSettings() {
    return {
      accent: formAccent,
      voice: $('voice').value || defaultVoice(formAccent),
      rate: Number($('rate').value),
      pause: Number($('pause').value),
      repeat: Number(formRepeat),
      loop: $('loop').checked
    };
  }

  function applyFormSettings(s) {
    formAccent = s.accent;
    formRepeat = s.repeat;
    accentSeg.set(s.accent);
    repeatSeg.set(s.repeat);
    $('rate').value = s.rate;
    $('pause').value = s.pause;
    $('loop').checked = !!s.loop;
    renderVoiceSelect();
    updateLabels();
  }

  function setRangeFill(el) {
    const min = Number(el.min);
    const max = Number(el.max);
    el.style.setProperty('--p', ((Number(el.value) - min) / (max - min)) * 100 + '%');
  }

  function updateLabels() {
    const rate = Number($('rate').value);
    const pause = Number($('pause').value);
    $('rateVal').textContent = `${fmtRate(rate)}x`;
    $('pauseVal').textContent = `${pause}秒`;
    setRangeFill($('rate'));
    setRangeFill($('pause'));
    $('settingsSummary').textContent =
      `${fmtRate(rate)}x · ${pause}秒 · ${formRepeat}回${$('loop').checked ? ' · ループ' : ''}`;

    const text = $('text').value;
    const empty = !text.trim();
    if (!dictation.active) {
      $('countline').textContent = empty ? '' : `${splitSentences(text).length}文 · ${countWords(text)}語`;
    }
    $('btnSave').disabled = empty;
  }

  function onFormChange() {
    updateLabels();
    if (editingId) return;
    const s = getFormSettings();
    prefs.accent = s.accent;
    prefs.rate = s.rate;
    prefs.pause = s.pause;
    prefs.repeat = s.repeat;
    prefs.loop = s.loop;
    prefs.kvoice = { ...prefs.kvoice, ...formVoice };
    savePrefs();
  }

  function settingsFromPrefs() {
    return {
      accent: prefs.accent,
      rate: prefs.rate,
      pause: prefs.pause,
      repeat: prefs.repeat,
      loop: prefs.loop
    };
  }

  function resetForm() {
    editingId = null;
    $('text').value = '';
    $('btnSave').textContent = '保存';
    $('btnCancelEdit').classList.add('hidden');
    formVoice = { ...prefs.kvoice };
    applyFormSettings(settingsFromPrefs());
    renderList();
  }

  function startEdit(item) {
    stopDictation();
    editingId = item.id;
    $('text').value = item.text;
    formVoice = { ...prefs.kvoice, [item.settings.accent]: item.settings.voice };
    applyFormSettings(item.settings);
    $('btnSave').textContent = '更新';
    $('btnCancelEdit').classList.remove('hidden');
    renderList();
    $('composer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function saveCurrent() {
    const text = $('text').value.trim();
    if (!text) return;
    stopDictation();
    const settings = getFormSettings();
    const now = Date.now();
    let item = null;
    let msg = '保存しました';

    if (editingId) {
      item = items.find((i) => i.id === editingId);
      if (item) {
        if (player.itemId === item.id) stopPlayback();
        Object.assign(item, { text, settings, updatedAt: now });
      }
      msg = '更新しました';
    } else {
      item = normalizeItem({ id: uid(), text, settings, createdAt: now, updatedAt: now });
      items.push(item);
    }
    if (!saveItems() || !item) return;

    requestPersist();
    const st = itemStatus(item);
    toast(st.ready ? msg : `${msg} · 音声を作成しています`);
    enqueueItem(item, true);
    resetForm();
    gc();
  }

  // ---------- 試聴 ----------
  const sampleAudio = new Audio();
  sampleAudio.preload = 'auto';

  function setSampleBusy(on) {
    const b = $('btnSample');
    b.classList.toggle('busy', on);
    b.setAttribute('aria-busy', String(on));
  }

  async function playSample() {
    if (!CAN_GENERATE) return;
    const voice = $('voice').value;
    const key = clipKey(voice, SAMPLE_TEXT);
    if (player.state === 'playing') togglePlay();
    sampleAudio.pause();

    if (clips.has(key)) {
      sampleAudio.src = clips.get(key).url;
      sampleAudio.play().catch(() => {});
      return;
    }

    // iPhone では、タップ中に一度再生しておかないと後から音を出せないため、無音で準備する
    sampleAudio.src = silentURL();
    sampleAudio.play().catch(() => {});
    setSampleBusy(true);
    try {
      await waitClip(key);
      if ($('voice').value === voice && clips.has(key)) {
        sampleAudio.src = clips.get(key).url;
        sampleAudio.play().catch(() => {});
      }
    } catch (e) {
      toast('試聴用の音声を作成できませんでした');
    } finally {
      setSampleBusy(false);
    }
  }

  // ---------- 音声入力 ----------
  const dictation = { rec: null, active: false, before: '', after: '', final: '' };

  function joinText(a, b) {
    return a && b ? `${a} ${b}` : (a || b);
  }

  function formatSegment(t) {
    let s = t.trim();
    if (!s) return '';
    s = s.replace(/\bi\b/g, 'I');
    s = s.charAt(0).toUpperCase() + s.slice(1);
    if (!/[.!?]["'”’)]?$/.test(s)) s += '.';
    return s;
  }

  function writeDictation(interim) {
    const ta = $('text');
    const mid = joinText(dictation.final, interim);
    const before = dictation.before;
    const after = dictation.after;
    const sepB = before && mid && !/\s$/.test(before) ? ' ' : '';
    const sepA = after && mid && !/^\s/.test(after) ? ' ' : '';
    ta.value = before + sepB + mid + sepA + after;
    const caret = (before + sepB + mid).length;
    try {
      ta.setSelectionRange(caret, caret);
    } catch (e) {}
    updateLabels();
  }

  function setMicUI() {
    const on = dictation.active;
    const btn = $('btnMic');
    btn.classList.toggle('recording', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? '音声入力を停止' : '音声入力');
    $('textwrap').classList.toggle('recording', on);
    const cl = $('countline');
    cl.classList.toggle('recording', on);
    if (on) {
      cl.textContent = `聞き取り中（${formAccent}）`;
    } else {
      updateLabels();
    }
  }

  function startDictation() {
    if (!Recognition) return;
    if (player.state === 'playing') togglePlay();

    const ta = $('text');
    const start = ta.selectionStart ?? ta.value.length;
    const end = ta.selectionEnd ?? ta.value.length;
    dictation.before = ta.value.slice(0, start);
    dictation.after = ta.value.slice(end);
    dictation.final = '';

    const rec = new Recognition();
    rec.lang = formAccent === 'UK' ? 'en-GB' : 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          dictation.final = joinText(dictation.final, formatSegment(r[0].transcript));
        } else {
          interim += r[0].transcript;
        }
      }
      writeDictation(interim.trim());
    };

    rec.onerror = (e) => {
      const messages = {
        'not-allowed': 'マイクの使用が許可されていません。ブラウザの設定で許可してください',
        'service-not-allowed': 'この環境では音声入力を利用できません',
        'no-speech': '音声が聞き取れませんでした',
        'audio-capture': 'マイクが見つかりません',
        'network': '音声認識サービスに接続できません'
      };
      if (messages[e.error]) toast(messages[e.error], null, 3600);
    };

    rec.onend = () => {
      dictation.active = false;
      dictation.rec = null;
      writeDictation('');
      setMicUI();
    };

    try {
      rec.start();
      dictation.rec = rec;
      dictation.active = true;
      setMicUI();
    } catch (err) {
      toast('音声入力を開始できませんでした');
    }
  }

  function stopDictation() {
    if (dictation.rec) dictation.rec.stop();
  }

  // ---------- ライブラリ ----------
  function itemMeta(i, st) {
    const parts = [`${timeLabel(i.createdAt)} 保存`];
    if (!st.ready) {
      if (st.failed) {
        parts.push('<span class="st-fail">音声を作成できませんでした</span>');
      } else if (st.active || st.have > 0) {
        parts.push(`<span class="st-gen">音声を作成中 ${st.have}/${st.total}文</span>`);
      } else {
        parts.push('<span class="st-gen">作成待ち</span>');
      }
      return parts.join(' · ');
    }
    parts.push(i.playCount ? `${i.playCount}回再生` : '未再生');
    if (i.lastPlayedAt) parts.push(`最終 ${relLabel(i.lastPlayedAt)}`);
    if (i.playLog.length >= 2) {
      const a = i.playLog[0].r;
      const b = i.playLog[i.playLog.length - 1].r;
      if (Math.abs(a - b) > 0.001) parts.push(`${fmtRate(a)}x → ${fmtRate(b)}x`);
    }
    return parts.join(' · ');
  }

  function itemHtml(i) {
    const st = itemStatus(i);
    const isCurrent = player.itemId === i.id && player.state !== 'idle';
    const isPlaying = isCurrent && player.state === 'playing';
    const sents = splitSentences(i.text);
    const head = sents[0] || i.text;
    const rest = sents.slice(1).join(' ');

    let cls = 'item-play';
    let icon = isPlaying ? ICON.pause : ICON.play;
    let label = isPlaying ? '一時停止' : '再生';
    let style = '';
    if (!st.ready) {
      if (st.failed) {
        cls += ' failed';
        icon = ICON.replay;
        label = '音声を作り直す';
      } else {
        cls += ' gen';
        style = ` style="--pg:${(st.have / Math.max(1, st.total)).toFixed(3)}"`;
        label = '音声を作成中';
      }
    }

    return `
      <div class="item ${isCurrent ? 'playing' : ''} ${editingId === i.id ? 'editing' : ''}">
        <button class="${cls}"${style} type="button" data-action="play" data-id="${i.id}" aria-label="${label}">
          ${icon}
        </button>
        <div class="item-body">
          <div class="item-head">
            <span class="item-title" lang="en">${escapeHtml(head)}</span>
            <span class="tag">${i.settings.accent}</span>
          </div>
          ${rest ? `<div class="item-snippet" lang="en">${escapeHtml(rest)}</div>` : ''}
          <div class="item-meta">${itemMeta(i, st)}</div>
        </div>
        <div class="item-actions">
          <button class="icon-btn" type="button" data-action="edit" data-id="${i.id}" aria-label="編集">${ICON.edit}</button>
          <button class="icon-btn danger" type="button" data-action="delete" data-id="${i.id}" aria-label="削除">${ICON.trash}</button>
        </div>
      </div>`;
  }

  function renderList() {
    if (!clipsLoaded) return;
    const search = $('search');
    const showSearch = items.length >= 6;
    search.classList.toggle('hidden', !showSearch);
    const q = showSearch ? search.value.trim().toLowerCase() : '';

    const filtered = items
      .filter((i) => !q || i.text.toLowerCase().includes(q))
      .sort((a, b) => b.createdAt - a.createdAt);

    const list = $('list');
    if (!filtered.length) {
      list.innerHTML = `<div class="glass list"><div class="empty">${items.length ? '一致する英文はありません' : '保存した英文は、保存した日ごとにここに並びます'}</div></div>`;
      return;
    }

    const groups = [];
    filtered.forEach((i) => {
      const key = startOfDay(i.createdAt);
      const last = groups[groups.length - 1];
      if (last && last.key === key) last.items.push(i);
      else groups.push({ key, items: [i] });
    });

    list.innerHTML = groups.map((g) => {
      const h = dayHeading(g.key);
      return `
        <div class="group">
          <div class="group-head">
            <span class="group-date">${h.date}</span>
            ${h.rel ? `<span class="group-rel">${h.rel}</span>` : ''}
            <span class="group-count">${g.items.length}件</span>
          </div>
          <div class="glass list">${g.items.map(itemHtml).join('')}</div>
        </div>`;
    }).join('');
  }

  function onListClick(e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const item = items.find((i) => i.id === btn.dataset.id);
    if (!item) return;
    const action = btn.dataset.action;
    if (action === 'play') {
      const st = itemStatus(item);
      if (st.ready) {
        playItem(item);
      } else if (st.failed) {
        enqueueItem(item, true);
        renderList();
      } else {
        toast(`音声を作成中です（${st.have}/${st.total}文）`);
      }
    }
    if (action === 'edit') startEdit(item);
    if (action === 'delete') deleteItem(item.id);
  }

  let gcTimer = null;
  function deleteItem(id) {
    const idx = items.findIndex((i) => i.id === id);
    if (idx < 0) return;
    const [removed] = items.splice(idx, 1);
    if (player.itemId === id) stopPlayback();
    if (editingId === id) resetForm();
    saveItems();
    renderList();
    renderEngine();
    lastDeleted = { item: removed, index: idx };
    clearTimeout(gcTimer);
    gcTimer = setTimeout(() => {
      lastDeleted = null;
      gc();
    }, 6500);
    toast(`「${truncate(firstSentence(removed.text), 16)}」を削除しました`, {
      label: '取り消す',
      onClick: () => {
        if (!lastDeleted) return;
        const restored = lastDeleted.item;
        items.splice(Math.min(lastDeleted.index, items.length), 0, restored);
        lastDeleted = null;
        clearTimeout(gcTimer);
        saveItems();
        enqueueItem(restored);
        renderList();
        toast('元に戻しました');
      }
    }, 6000);
  }

  // ---------- 再生 ----------
  const audio = new Audio();
  audio.preload = 'auto';

  function keepPitch(el) {
    el.preservesPitch = true;
    el.mozPreservesPitch = true;
    el.webkitPreservesPitch = true;
  }

  const player = {
    sentences: [],
    keys: [],
    plan: [],
    step: 0,
    settings: null,
    itemId: null,
    state: 'idle',
    timer: null,
    raf: 0,
    clip: null,
    gapNext: null,
    switchAt: 0,
    rendered: -1,
    words: [],
    revealedMax: -1,
    nowIdx: -1,
    logEntry: null
  };

  function buildPlan(n, repeat) {
    const plan = [];
    for (let s = 0; s < n; s++) {
      for (let r = 0; r < repeat; r++) plan.push({ s, r });
    }
    return plan;
  }

  function curSentence() {
    if (!player.plan.length) return 0;
    return player.plan[Math.min(player.step, player.plan.length - 1)].s;
  }

  function playItem(item) {
    if (player.itemId === item.id && player.state !== 'idle') {
      togglePlay();
      return;
    }
    sampleAudio.pause();
    const entry = { t: Date.now(), r: item.settings.rate };
    item.playLog.push(entry);
    if (item.playLog.length > 500) item.playLog.splice(0, item.playLog.length - 500);
    item.playCount += 1;
    item.lastPlayedAt = entry.t;
    saveItems();

    const sentences = splitSentences(item.text);
    Object.assign(player, {
      sentences,
      keys: sentences.map((s) => clipKey(item.settings.voice, s)),
      plan: buildPlan(sentences.length, item.settings.repeat),
      step: 0,
      settings: { ...item.settings },
      itemId: item.id,
      rendered: -1,
      logEntry: entry
    });
    $('pTitle').textContent = `${item.settings.accent} · ${voiceLabel(item.settings.voice)}`;
    renderBar();
    showPlayer(true);
    playStep(0);
    renderList();
  }

  function safePlay() {
    const p = audio.play();
    if (p && p.catch) {
      p.catch((err) => {
        if (err && err.name === 'AbortError') return;
        if (player.state === 'playing') {
          player.state = 'paused';
          stopTicker();
          updatePlayerUI();
          renderList();
        }
      });
    }
  }

  function playStep(step) {
    clearTimeout(player.timer);
    player.gapNext = null;

    if (step >= player.plan.length) {
      if (player.settings.loop) {
        step = 0;
      } else {
        finishPlayback();
        return;
      }
    }

    player.step = step;
    const sIdx = player.plan[step].s;
    if (player.rendered !== sIdx) renderSentence(sIdx);
    clearNow();

    const clip = clips.get(player.keys[sIdx]);
    if (!clip) {
      player.state = 'paused';
      updatePlayerUI();
      renderList();
      const it = items.find((i) => i.id === player.itemId);
      if (it) enqueueItem(it, true);
      toast('この文の音声が見つからないため、作り直しています');
      return;
    }

    player.state = 'playing';
    player.clip = clip;
    player.switchAt = performance.now();
    if (audio.src !== clip.url) {
      audio.src = clip.url;
    } else {
      audio.currentTime = 0;
    }
    audio.defaultPlaybackRate = player.settings.rate;
    audio.playbackRate = player.settings.rate;
    keepPitch(audio);
    safePlay();
    startTicker();
    updatePlayerUI();
  }

  function onClipEnded() {
    if (player.state !== 'playing') return;
    stopTicker();
    revealAll();
    const next = player.step + 1;
    if (next >= player.plan.length && !player.settings.loop) {
      finishPlayback();
      return;
    }
    const wait = player.settings.pause * 1000;
    if (wait <= 0) {
      playStep(next);
      return;
    }
    player.gapNext = next;
    player.timer = setTimeout(() => {
      if (player.state === 'playing') playStep(next);
    }, wait);
  }

  function startTicker() {
    stopTicker();
    const tick = () => {
      if (player.state !== 'playing' || !player.clip) return;
      const span = Math.max(0.1, player.clip.dur - LEAD - TAIL);
      revealAt((audio.currentTime - LEAD) / span);
      player.raf = requestAnimationFrame(tick);
    };
    player.raf = requestAnimationFrame(tick);
  }

  function stopTicker() {
    cancelAnimationFrame(player.raf);
    player.raf = 0;
  }

  function renderSentence(sIdx) {
    const s = player.sentences[sIdx];
    const el = $('pSentence');
    const tokens = [];
    let html = '';
    let last = 0;
    s.replace(/\S+/g, (m, offset) => {
      html += escapeHtml(s.slice(last, offset)) + `<span class="w">${escapeHtml(m)}</span>`;
      tokens.push(m);
      last = offset + m.length;
      return m;
    });
    html += escapeHtml(s.slice(last));
    el.innerHTML = html;
    el.scrollTop = 0;

    // 単語の長さと句読点の間から、各単語が読まれる位置を見積もる
    const weights = tokens.map((t) => {
      let w = t.replace(/[^\p{L}\p{N}']/gu, '').length + 1;
      if (/[,;:]["'”’)]?$/.test(t)) w += 3;
      return w;
    });
    const total = weights.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    player.words = [...el.querySelectorAll('.w')].map((w, i) => {
      const f = acc / total;
      acc += weights[i];
      return { el: w, f };
    });
    player.rendered = sIdx;
    player.revealedMax = -1;
    player.nowIdx = -1;
  }

  function revealAt(t) {
    if (t < 0) return;
    const words = player.words;
    let k = -1;
    for (let i = 0; i < words.length; i++) {
      if (words[i].f <= t + 0.015) k = i;
      else break;
    }
    if (k < 0) return;
    for (let i = player.revealedMax + 1; i <= k; i++) words[i].el.classList.add('clear');
    player.revealedMax = Math.max(player.revealedMax, k);
    if (k !== player.nowIdx) {
      if (player.nowIdx >= 0 && words[player.nowIdx]) words[player.nowIdx].el.classList.remove('now');
      words[k].el.classList.add('now');
      player.nowIdx = k;
    }
  }

  function clearNow() {
    if (player.nowIdx >= 0 && player.words[player.nowIdx]) {
      player.words[player.nowIdx].el.classList.remove('now');
    }
    player.nowIdx = -1;
  }

  function revealAll() {
    player.words.forEach((w) => w.el.classList.add('clear'));
    player.revealedMax = player.words.length - 1;
    clearNow();
  }

  function finishPlayback() {
    clearTimeout(player.timer);
    stopTicker();
    player.gapNext = null;
    player.state = 'done';
    player.step = player.plan.length - 1;
    revealAll();
    updatePlayerUI();
    renderList();
  }

  function togglePlay() {
    if (player.state === 'playing') {
      player.state = 'paused';
      clearTimeout(player.timer);
      audio.pause();
      stopTicker();
      clearNow();
    } else if (player.state === 'paused') {
      if (player.gapNext !== null) {
        playStep(player.gapNext);
      } else if (!player.clip || audio.ended) {
        playStep(player.step);
      } else {
        player.state = 'playing';
        audio.playbackRate = player.settings.rate;
        safePlay();
        startTicker();
      }
    } else if (player.state === 'done') {
      player.rendered = -1;
      playStep(0);
    }
    updatePlayerUI();
    renderList();
  }

  function jumpTo(sIdx) {
    if (!player.sentences.length) return;
    const wasPlaying = player.state === 'playing';
    const s = Math.max(0, Math.min(sIdx, player.sentences.length - 1));
    playStep(s * player.settings.repeat);
    if (!wasPlaying) renderList();
  }

  function stopPlayback() {
    clearTimeout(player.timer);
    stopTicker();
    audio.pause();
    player.state = 'idle';
    player.itemId = null;
    player.clip = null;
    player.gapNext = null;
    player.logEntry = null;
    showPlayer(false);
    renderList();
  }

  function showPlayer(on) {
    const p = $('player');
    p.classList.toggle('show', on);
    p.setAttribute('aria-hidden', String(!on));
    document.body.classList.toggle('has-player', on);
    $('pSentence').dataset.mode = prefs.display;
  }

  function renderBar() {
    const bar = $('pBar');
    const n = player.sentences.length;
    bar.classList.toggle('dense', n > 40);
    bar.innerHTML = player.sentences
      .map((_, i) => `<button type="button" data-index="${i}" aria-label="${i + 1}文目"></button>`)
      .join('');
  }

  function updatePlayerUI() {
    const n = player.sentences.length;
    if (!n || !player.settings) return;
    const idx = curSentence();
    const rep = player.plan[Math.min(player.step, player.plan.length - 1)].r;
    const done = player.state === 'done';

    [...$('pBar').children].forEach((seg, i) => {
      seg.classList.toggle('done', done || i < idx);
      seg.classList.toggle('current', !done && i === idx);
    });

    let progress = `${idx + 1} / ${n}`;
    if (player.settings.repeat > 1 && !done) {
      progress += ` · ${rep + 1}/${player.settings.repeat}回目`;
    }
    $('pProgress').textContent = progress;

    const playBtn = $('pPlay');
    if (player.state === 'playing') {
      playBtn.innerHTML = ICON.pause;
      playBtn.setAttribute('aria-label', '一時停止');
    } else if (done) {
      playBtn.innerHTML = ICON.replay;
      playBtn.setAttribute('aria-label', '最初から再生');
    } else {
      playBtn.innerHTML = ICON.play;
      playBtn.setAttribute('aria-label', '再生');
    }

    $('pPrev').disabled = idx === 0 && !done;
    $('pNext').disabled = idx >= n - 1;
    $('pRate').textContent = `${fmtRate(player.settings.rate)}x`;
    $('pMode').textContent = MODE_LABEL[prefs.display];
  }

  function cycleRate() {
    const cur = player.settings.rate;
    const next = RATES.find((r) => r > cur + 0.001) ?? RATES[0];
    player.settings.rate = next;
    audio.defaultPlaybackRate = next;
    audio.playbackRate = next;
    keepPitch(audio);

    const it = items.find((i) => i.id === player.itemId);
    if (it) {
      it.settings.rate = next;
      if (player.logEntry) player.logEntry.r = next;
      saveItems();
      renderList();
    }
    updatePlayerUI();
  }

  function cycleMode() {
    prefs.display = MODES[(MODES.indexOf(prefs.display) + 1) % MODES.length];
    savePrefs();
    $('pSentence').dataset.mode = prefs.display;
    updatePlayerUI();
  }

  // ---------- 初期化 ----------
  function init() {
    $('btnMic').innerHTML = ICON.mic;
    $('btnSample').innerHTML = ICON.speaker;
    $('selectChevron').innerHTML = ICON.chevron;
    $('summaryChevron').innerHTML = ICON.chevron;
    $('pClose').innerHTML = ICON.close;
    $('pPrev').innerHTML = ICON.prev;
    $('pNext').innerHTML = ICON.next;
    keepPitch(audio);

    applyTheme();
    $('btnTheme').addEventListener('click', cycleTheme);

    accentSeg = setupSegmented($('accentSeg'), formAccent, (v) => {
      formAccent = v;
      renderVoiceSelect();
      onFormChange();
      if (dictation.active) setMicUI();
    });

    repeatSeg = setupSegmented($('repeatSeg'), formRepeat, (v) => {
      formRepeat = Number(v);
      onFormChange();
    });

    applyFormSettings(settingsFromPrefs());

    if (!CAN_GENERATE) {
      showNotice('このブラウザでは音声を作成できません。Chrome、Edge、Safari の最新版で開いてください。');
      $('btnSample').disabled = true;
    }

    if (Recognition) {
      $('btnMic').classList.remove('hidden');
      $('btnMic').addEventListener('click', () => {
        if (dictation.active) stopDictation();
        else startDictation();
      });
    }

    $('voice').addEventListener('change', (e) => {
      formVoice[formAccent] = e.target.value;
      onFormChange();
    });
    $('btnSample').addEventListener('click', playSample);
    ['rate', 'pause'].forEach((id) => $(id).addEventListener('input', onFormChange));
    $('loop').addEventListener('change', onFormChange);
    $('text').addEventListener('input', updateLabels);

    $('btnSave').addEventListener('click', saveCurrent);
    $('btnCancelEdit').addEventListener('click', resetForm);

    $('list').addEventListener('click', onListClick);
    $('search').addEventListener('input', renderList);

    audio.addEventListener('ended', onClipEnded);
    audio.addEventListener('pause', () => {
      // コントロールセンターやイヤホンの操作で止められたときに表示を合わせる
      if (player.state !== 'playing' || audio.ended) return;
      if (performance.now() - player.switchAt < 400) return;
      player.state = 'paused';
      clearTimeout(player.timer);
      stopTicker();
      updatePlayerUI();
      renderList();
    });

    $('pPlay').addEventListener('click', togglePlay);
    $('pPrev').addEventListener('click', () => {
      jumpTo(player.state === 'done' ? player.sentences.length - 1 : curSentence() - 1);
    });
    $('pNext').addEventListener('click', () => jumpTo(curSentence() + 1));
    $('pClose').addEventListener('click', stopPlayback);
    $('pRate').addEventListener('click', cycleRate);
    $('pMode').addEventListener('click', cycleMode);
    $('pBar').addEventListener('click', (e) => {
      const seg = e.target.closest('button[data-index]');
      if (seg) jumpTo(Number(seg.dataset.index));
    });

    const sentenceEl = $('pSentence');
    const peekOn = () => sentenceEl.classList.add('peek');
    const peekOff = () => sentenceEl.classList.remove('peek');
    sentenceEl.addEventListener('pointerdown', peekOn);
    sentenceEl.addEventListener('pointerup', peekOff);
    sentenceEl.addEventListener('pointerleave', peekOff);
    sentenceEl.addEventListener('pointercancel', peekOff);

    document.addEventListener('keydown', (e) => {
      if (!$('player').classList.contains('show')) return;
      const t = e.target;
      const inField = t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
      if (inField) return;
      if (e.code === 'Space' && !(t.closest && t.closest('button'))) {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        jumpTo(curSentence() - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        jumpTo(curSentence() + 1);
      } else if (e.key === 'Escape') {
        stopPlayback();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderList();
    });

    if (!CAN_GENERATE) {
      clipsLoaded = true;
      renderList();
      return;
    }

    loadAllClips()
      .catch(() => {
        showNotice('音声を保存する領域を開けませんでした。プライベートブラウズを使っている場合は、通常のウィンドウで開いてください。');
      })
      .then(() => {
        clipsLoaded = true;
        renderList();
        gc();
        items.slice().sort((a, b) => b.createdAt - a.createdAt).forEach((i) => enqueueItem(i));
      });
  }

  init();
})();
</script>
</body>
</html>
