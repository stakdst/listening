    display: flex;
    align-items: center;
    gap: 14px;
  }

  .p-transport .icon-btn {
    width: 44px;
    height: 44px;
    color: var(--text);
  }

  .p-transport .icon-btn svg { width: 24px; height: 24px; }

  .play-btn {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 8px 22px color-mix(in srgb, var(--accent) 34%, transparent);
  }

  .play-btn svg { width: 26px; height: 26px; }

  .play-btn.pending::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .chip {
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    background: var(--seg-bg);
    font-size: 0.8rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: background-color 0.2s;
  }

  .p-controls .chip:first-child { justify-self: start; }

  .p-controls .chip:last-child { justify-self: end; }

  /* ---------- トースト ---------- */
  .toast {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: calc(100% - 32px);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    box-shadow: var(--shadow-float), inset 0 1px 0 var(--inner-hl);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -10px);
    transition: opacity 0.25s var(--ease), transform 0.35s var(--ease);
  }

  .toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }

  .toast .link { font-weight: 600; white-space: nowrap; }

  @media (max-width: 480px) {
    .card { padding: 16px; }
    .voice-row { grid-template-columns: 112px 1fr; }
    .setting-inline .segmented { width: 168px; }
    .player { padding: 14px 16px 16px; border-radius: 28px; }
    .p-transport { gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>

<main>
  <header class="hero">

    <button id="btnTheme" class="round-btn glass" type="button"></button>
  </header>

  <section class="glass card" id="composer">
    <p id="unsupported" class="notice hidden">このブラウザは読み上げに対応していません。Chrome、Edge、Safari の最新版で開いてください。</p>

    <div class="stack">
      <div class="textwrap" id="textwrap">
        <textarea id="text" class="field" placeholder="Type or dictate English here." aria-label="英文" spellcheck="true" lang="en"></textarea>
        <button id="btnMic" class="mic hidden" type="button" aria-label="音声入力" aria-pressed="false"></button>

        <summary>

        <div class="settings-body">
          <div>
            <div class="setting-head">

<script>
(() => {
  'use strict';

  const ITEMS_KEY = 'listeningMaker.items.v1';

  const $ = (id) => document.getElementById(id);

  const STROKE = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';

  };

  const THEME_LABEL = { system: '自動', light: 'ライト', dark: 'ダーク' };
  const MODES = ['follow', 'all', 'hide'];
  const MODE_LABEL = { follow: '声に合わせる', all: '常に表示', hide: '隠す' };
  const RATES = [0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.3];
  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  // 効果音・合成風・子どもの声など、ふつうの人の声ではないもの
  const EXCLUDED = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Princess|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Ana|Maisie)\b/i;

  // 声の特徴（名前ではなく、性別と声の印象で表示する）
  const TRAITS = {
    aria: ['女性', 'はきはき'],
    jenny: ['女性', 'やわらか'],
    michelle: ['女性', '明るい'],
    emma: ['女性', '明瞭'],
    ava: ['女性', '落ち着いた'],
    samantha: ['女性', '標準的'],
    allison: ['女性', 'やわらか'],
    susan: ['女性', '落ち着いた'],
    zoe: ['女性', '明るい'],
    nicky: ['女性', '若々しい'],
    joelle: ['女性', 'やさしい'],
    zira: ['女性', '標準的'],
    sonia: ['女性', '上品'],
    libby: ['女性', '明るい'],
    kate: ['女性', '落ち着いた'],
    serena: ['女性', '上品'],
    stephanie: ['女性', 'やわらか'],
    martha: ['女性', '上品'],
    hazel: ['女性', '標準的'],
    guy: ['男性', '力強い'],
    christopher: ['男性', '低め'],
    eric: ['男性', '淡々'],
    roger: ['男性', '快活'],
    steffan: ['男性', '淡々'],
    andrew: ['男性', '温かい'],
    brian: ['男性', '気さく'],
    tom: ['男性', '標準的'],
    alex: ['男性', '明瞭'],
    aaron: ['男性', '落ち着いた'],
    evan: ['男性', '若々しい'],
    nathan: ['男性', '低め'],
    david: ['男性', '標準的'],
    mark: ['男性', '標準的'],
    ryan: ['男性', '明るい'],
    thomas: ['男性', '落ち着いた'],
    daniel: ['男性', '標準的'],
    arthur: ['男性', '低め'],
    oliver: ['男性', 'やわらか'],
    george: ['男性', '標準的'],
    'google us english': ['女性', '明瞭'],
    'google uk english female': ['女性', '明瞭'],
    'google uk english male': ['男性', '明瞭']
  };

  const DEFAULT_PREFS = {
    theme: 'system',
    accent: 'US',
    voice: { US: '', UK: '' },
    rate: 1,
    pause: 1,
    repeat: 1,
    loop: false,
    display: 'follow'
  };

  // ---------- 保存 ----------
  function loadJSON(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  function loadPrefs() {
    const p = loadJSON(PREFS_KEY, {});
    return {
      ...DEFAULT_PREFS,
      ...p,
      voice: { ...DEFAULT_PREFS.voice, ...(p.voice || {}) }
    };
  }

  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        theme: prefs.theme,
        accent: prefs.accent,
        voice: prefs.voice,
        rate: prefs.rate,
        pause: prefs.pause,
        repeat: prefs.repeat,
        loop: prefs.loop,
        display: prefs.display
      }));
    } catch (e) {}
  }

  function clampNum(v, min, max, fallback) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function normalizeItem(i) {
    const s = i.settings || {};
    const accent = s.accent === 'US' || s.accent === 'UK'
      ? s.accent
      : (/(en-GB|\bUK\b|British|United Kingdom)/i.test(s.voiceName || '') ? 'UK' : 'US');
    const created = Number(i.createdAt) || Date.now();
    return {
      id: String(i.id),
      text: String(i.text),
      settings: {
        accent,
        voiceURI: s.voiceURI || '',
        voiceName: s.voiceName || '',
        rate: clampNum(s.rate, 0.5, 1.5, 1),
        pause: clampNum(s.pause, 0, 5, 1),
        repeat: [1, 2, 3, 5].includes(Number(s.repeat)) ? Number(s.repeat) : 1,
        loop: !!s.loop
      },
      createdAt: created,
      updatedAt: Number(i.updatedAt) || created,
      lastPlayedAt: Number(i.lastPlayedAt) || null,
      playCount: Number(i.playCount) || 0,
      playLog: Array.isArray(i.playLog)
        ? i.playLog.filter((e) => e && e.t).map((e) => ({ t: Number(e.t), r: Number(e.r) || 1 }))
        : []
    };
  }

  function loadItems() {
    const raw = loadJSON(ITEMS_KEY, []);
    if (!Array.isArray(raw)) return [];
    return raw.filter((i) => i && i.id && i.text).map(normalizeItem);
  }

  function saveItems() {
    try {
      localStorage.setItem(ITEMS_KEY, JSON.stringify(items));
      return true;
    } catch (e) {
      toast('保存できませんでした。ブラウザの保存容量を確認してください');
      return false;
    }
  }

  const prefs = loadPrefs();
  let items = loadItems();
  let editingId = null;
  let formAccent = prefs.accent;
  let formRepeat = prefs.repeat;
  let formVoice = { ...prefs.voice };
  let voicesByAccent = { US: [], UK: [] };
  let bestTier = { US: 0, UK: 0 };
  const failedVoices = new Set();
  let lastDeleted = null;
  let accentSeg = null;
  let repeatSeg = null;

  // ---------- ユーティリティ ----------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function truncate(s, n) {
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function fmtRate(r) {
    return Number(r).toFixed(2).replace(/0$/, '');
  }

  function splitSentences(text) {
    const cleaned = String(text).replace(/\s+/g, ' ').trim();
    if (!cleaned) return [];
    const parts = cleaned.split(/(?<=[.!?]["'”’)\]]*)\s+/);
    const out = [];
    parts.forEach((p) => {
      if (out.length && ABBR.test(out[out.length - 1])) {
        out[out.length - 1] += ' ' + p;
      } else {
        out.push(p);
      }
    });
    return out.filter(Boolean);
  }

  function firstSentence(text) {
    return splitSentences(text)[0] || String(text).trim();
  }

  function countWords(text) {
    const t = text.trim();
    return t ? t.split(/\s+/).length : 0;
  }

  function startOfDay(ts) {
    const d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }

  function daysAgo(ts) {
    return Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000);
  }

  function shortDate(ts) {
    const d = new Date(ts);
    const md = `${d.getMonth() + 1}/${d.getDate()}`;
    return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}/${md}`;
  }

  function relLabel(ts) {
    const diff = daysAgo(ts);
    if (diff <= 0) return '今日';
    if (diff === 1) return '昨日';
    if (diff < 7) return `${diff}日前`;
    return shortDate(ts);
  }

  function dayHeading(ts) {
    const d = new Date(ts);
    const md = `${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
    const date = d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}年${md}`;
    const diff = daysAgo(ts);
    let rel = '';
    if (diff === 0) rel = '今日';
    else if (diff === 1) rel = '昨日';
    else if (diff > 1 && diff < 7) rel = `${diff}日前`;
    return { date, rel };
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  let toastTimer = null;
  function toast(msg, action, duration) {
    const t = $('toast');
    t.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = msg;
    t.appendChild(span);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'link';
      b.textContent = action.label;
      b.addEventListener('click', () => {
        t.classList.remove('show');
        action.onClick();
      });
      t.appendChild(b);
    }
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration || 2400);
  }

  // ---------- テーマ ----------
  function applyTheme() {
    const root = document.documentElement;
    if (prefs.theme === 'system') {
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', prefs.theme);
    }
    const b = $('btnTheme');
    const icon = prefs.theme === 'system' ? 'auto' : prefs.theme === 'light' ? 'sun' : 'moon';
    b.innerHTML = ICON[icon];
    b.setAttribute('aria-label', `表示モード: ${THEME_LABEL[prefs.theme]}`);
    b.title = `表示モード: ${THEME_LABEL[prefs.theme]}`;
  }

  function cycleTheme() {
    prefs.theme = THEMES[(THEMES.indexOf(prefs.theme) + 1) % THEMES.length];
    savePrefs();
    applyTheme();
    toast(`表示モード: ${THEME_LABEL[prefs.theme]}`);
  }

  // ---------- セグメント ----------
  function setupSegmented(el, value, onChange) {
    const btns = [...el.querySelectorAll('button')];
    el.style.setProperty('--n', btns.length);
    const set = (v, emit) => {
      const i = Math.max(0, btns.findIndex((b) => b.dataset.value === String(v)));
      el.style.setProperty('--i', i);
      btns.forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
      if (emit) onChange(btns[i].dataset.value);
    };
    btns.forEach((b) => b.addEventListener('click', () => set(b.dataset.value, true)));
    set(value, false);
    return { set: (v) => set(v, false) };
  }

  // ---------- 声の選別 ----------
  function accentOf(v) {
    const l = (v.lang || '').replace('_', '-').toLowerCase();
    if (l.startsWith('en-us')) return 'US';
    if (l.startsWith('en-gb')) return 'UK';
    return null;
  }

  function baseName(v) {
    return v.name
      .replace(/^Microsoft\s+/i, '')
      .replace(/\s+Online\b.*$/i, '')
      .replace(/\s*-\s*English.*$/i, '')
      .replace(/\s*\((Enhanced|Premium|Natural)\)/gi, '')
      .replace(/\s*\(English.*\)\s*$/i, '')
      .replace(/\s+Desktop$/i, '')
      .replace(/Multilingual$/i, '')
      .trim();
  }

  // 0: 除外 / 1: 旧式（他に無いときだけ表示）/ 2: 標準 / 3: 高音質
  function voiceTier(v) {
    const base = baseName(v);
    const id = `${v.name} ${v.voiceURI || ''}`;
    if (EXCLUDED.test(base) || /eloquence/i.test(id)) return 0;
    if (/natural|neural|premium|enhanced|siri/i.test(id)) return 3;
    if (/^Microsoft/i.test(v.name)) return /online/i.test(v.name) ? 3 : 1;
    return 2;
  }

  function qualityScore(v) {
    const id = `${v.name} ${v.voiceURI || ''}`;
    if (/premium|natural|neural/i.test(id)) return 3;
    if (/enhanced|siri/i.test(id)) return 2;
    if (/^Google/i.test(v.name)) return 1;
    return 0;
  }

  function traitOf(base) {
    const t = TRAITS[base.toLowerCase()];
    if (t) return { gender: t[0], label: `${t[0]} · ${t[1]}` };
    if (/female/i.test(base)) return { gender: '女性', label: '女性' };
    if (/male/i.test(base)) return { gender: '男性', label: '男性' };
    return { gender: '', label: '標準の声' };
  }

  function genderOrder(g) {
    return g === '女性' ? 0 : g === '男性' ? 1 : 2;
  }

  function loadVoices() {
    if (!synth) return;
    const groups = { US: [], UK: [] };
    synth.getVoices().forEach((v) => {
      const accent = accentOf(v);
      if (!accent || failedVoices.has(v.voiceURI)) return;
      const tier = voiceTier(v);
      if (!tier) return;
      groups[accent].push({ v, tier, score: qualityScore(v), base: baseName(v) });
    });

    const next = { US: [], UK: [] };
    const tiers = { US: 0, UK: 0 };

    Object.keys(groups).forEach((k) => {
      const all = groups[k];
      const good = all.filter((e) => e.tier >= 2);
      // 端末内の声はすぐに話し始めるため、品質が足りていれば端末内の声だけを使う
      const localGood = good.filter((e) => e.v.localService);
      const pool = localGood.length ? localGood : (good.length ? good : all);

      const byBase = new Map();
      pool.forEach((e) => {
        const key = e.base.toLowerCase();
        const cur = byBase.get(key);
        if (!cur || e.tier * 10 + e.score > cur.tier * 10 + cur.score) byBase.set(key, e);
      });

      const list = [...byBase.values()].map((e) => ({ ...e, ...traitOf(e.base) }));
      list.sort((a, b) =>
        b.tier - a.tier
        || genderOrder(a.gender) - genderOrder(b.gender)
        || b.score - a.score
        || a.label.localeCompare(b.label, 'ja'));

      const count = {};
      list.forEach((e) => { count[e.label] = (count[e.label] || 0) + 1; });
      const seq = {};
      list.forEach((e) => {
        const l = e.label;
        if (count[l] > 1) {
          seq[l] = (seq[l] || 0) + 1;
          e.label = `${l} ${seq[l]}`;
        }
      });

      next[k] = list;
      tiers[k] = list.length ? Math.max(...list.map((e) => e.tier)) : 0;
    });

    voicesByAccent = next;
    bestTier = tiers;
    renderVoiceSelect();
    if (player.state !== 'idle') updatePlayerTitle();
  }

  function voicesReady() {
    return voicesByAccent.US.length > 0 || voicesByAccent.UK.length > 0;
  }

  function waitVoices() {
    if (!synth || voicesReady()) return Promise.resolve();
    if (synth.getVoices().length) {
      loadVoices();
      return Promise.resolve();
    }
    return new Promise((resolve) => {
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        synth.removeEventListener('voiceschanged', done);
        loadVoices();
        resolve();
      };
      const timer = setTimeout(done, 800);
      synth.addEventListener('voiceschanged', done);
    });
  }

  function qualityHint() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua)) {
      return '高音質の声は「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 英語」で追加できます。追加後にページを再読み込みしてください。';
    }
    if (/Macintosh/.test(ua)) {
      return '高音質の声は「システム設定 → アクセシビリティ → 読み上げコンテンツ → システムの声 → 声を管理」で追加できます。';
    }
    if (/Windows/.test(ua)) {
      return 'Microsoft Edge で開くと、高音質の声を使えます。';
    }
    return 'Chrome または Edge で開くと、高音質の声を使えます。';
  }

  function renderVoiceSelect() {
    const sel = $('voice');
    const list = voicesByAccent[formAccent];
    const want = formVoice[formAccent];
    sel.innerHTML = '';
    if (!list.length) {
      sel.add(new Option('標準の声', ''));
      sel.disabled = true;
    } else {
      sel.disabled = false;
      list.forEach((e) => sel.add(new Option(e.label, e.v.voiceURI)));
      sel.value = list.some((e) => e.v.voiceURI === want) ? want : list[0].v.voiceURI;
    }
    const hint = $('voiceHint');
    const low = synth && synth.getVoices().length && bestTier[formAccent] < 2;
    hint.textContent = low ? qualityHint() : '';
    hint.classList.toggle('hidden', !low);
  }

  function findVoice(settings) {
    const list = voicesByAccent[settings.accent] || [];
    return list.find((e) => e.v.voiceURI === settings.voiceURI)
      || list.find((e) => e.v.name === settings.voiceName)
      || list[0]
      || null;
  }

  function langOf(accent) {
    return accent === 'UK' ? 'en-GB' : 'en-US';
  }

  // 声の読み込みを先に済ませておき、再生ボタンを押した瞬間に話し始められるようにする
  function warmUp(entry) {
    if (!synth || synth.speaking || synth.pending) return;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    if (entry) {
      u.voice = entry.v;
      u.lang = (entry.v.lang || '').replace('_', '-');
    }
    synth.speak(u);
  }

  // ---------- フォーム ----------
  function getFormSettings() {
    const sel = $('voice');
    const e = voicesByAccent[formAccent].find((x) => x.v.voiceURI === sel.value);
    return {
      accent: formAccent,
      voiceURI: e ? e.v.voiceURI : '',
      voiceName: e ? e.v.name : '',
      rate: Number($('rate').value),
      pause: Number($('pause').value),
      repeat: Number(formRepeat),
      loop: $('loop').checked
    };
  }

  function applyFormSettings(s) {
    formAccent = s.accent;
    formRepeat = s.repeat;
    accentSeg.set(s.accent);
    repeatSeg.set(s.repeat);
    $('rate').value = s.rate;
    $('pause').value = s.pause;
    $('loop').checked = !!s.loop;
    renderVoiceSelect();
    updateLabels();
  }

  function setRangeFill(el) {
    const min = Number(el.min);
    const max = Number(el.max);
    el.style.setProperty('--p', ((Number(el.value) - min) / (max - min)) * 100 + '%');
  }

  function updateLabels() {
    const rate = Number($('rate').value);
    const pause = Number($('pause').value);
    $('rateVal').textContent = `${fmtRate(rate)}x`;
    $('pauseVal').textContent = `${pause}秒`;
    setRangeFill($('rate'));
    setRangeFill($('pause'));
    $('settingsSummary').textContent =
      `${fmtRate(rate)}x · ${pause}秒 · ${formRepeat}回${$('loop').checked ? ' · ループ' : ''}`;

    const text = $('text').value;
    const empty = !text.trim();
    if (!dictation.active) {
      $('countline').textContent = empty ? '' : `${splitSentences(text).length}文 · ${countWords(text)}語`;
    }
    $('btnSave').disabled = empty;
    $('btnPreview').disabled = empty || !synth;
  }

  function onFormChange() {
    updateLabels();
    if (editingId) return;
    const s = getFormSettings();
    prefs.accent = s.accent;
    prefs.rate = s.rate;
    prefs.pause = s.pause;
    prefs.repeat = s.repeat;
    prefs.loop = s.loop;
    prefs.voice = { ...prefs.voice, ...formVoice };
    savePrefs();
  }

  function settingsFromPrefs() {
    return {
      accent: prefs.accent,
      rate: prefs.rate,
      pause: prefs.pause,
      repeat: prefs.repeat,
      loop: prefs.loop
    };
  }

  function resetForm() {
    editingId = null;
    $('text').value = '';
    $('btnSave').textContent = '保存';
    $('btnCancelEdit').classList.add('hidden');
    formVoice = { ...prefs.voice };
    applyFormSettings(settingsFromPrefs());
    renderList();
  }

  function startEdit(item) {
    stopDictation();
    editingId = item.id;
    $('text').value = item.text;
    formVoice = { ...prefs.voice, [item.settings.accent]: item.settings.voiceURI };
    applyFormSettings(item.settings);
    $('btnSave').textContent = '更新';
    $('btnCancelEdit').classList.remove('hidden');
    renderList();
    $('composer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function saveCurrent() {
    const text = $('text').value.trim();
    if (!text) return;
    stopDictation();
    const settings = getFormSettings();
    const now = Date.now();

    if (editingId) {
      const it = items.find((i) => i.id === editingId);
      if (it) Object.assign(it, { text, settings, updatedAt: now });
      if (saveItems()) toast('更新しました');
    } else {
      items.push(normalizeItem({ id: uid(), text, settings, createdAt: now, updatedAt: now }));
      if (saveItems()) toast('保存しました');
    }
    resetForm();
  }

  // ---------- 音声入力 ----------
  const dictation = { rec: null, active: false, before: '', after: '', final: '' };

  function joinText(a, b) {
    return a && b ? `${a} ${b}` : (a || b);
  }

  function formatSegment(t) {
    let s = t.trim();
    if (!s) return '';
    s = s.replace(/\bi\b/g, 'I');
    s = s.charAt(0).toUpperCase() + s.slice(1);
    if (!/[.!?]["'”’)]?$/.test(s)) s += '.';
    return s;
  }

  function writeDictation(interim) {
    const ta = $('text');
    const mid = joinText(dictation.final, interim);
    const before = dictation.before;
    const after = dictation.after;
    const sepB = before && mid && !/\s$/.test(before) ? ' ' : '';
    const sepA = after && mid && !/^\s/.test(after) ? ' ' : '';
    ta.value = before + sepB + mid + sepA + after;
    const caret = (before + sepB + mid).length;
    try {
      ta.setSelectionRange(caret, caret);
    } catch (e) {}
    updateLabels();
  }

  function setMicUI() {
    const on = dictation.active;
    const btn = $('btnMic');
    btn.classList.toggle('recording', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? '音声入力を停止' : '音声入力');
    $('textwrap').classList.toggle('recording', on);
    const cl = $('countline');
    cl.classList.toggle('recording', on);
    if (on) {
      cl.textContent = `聞き取り中（${formAccent}）`;
    } else {
      updateLabels();
    }
  }

  function startDictation() {
    if (!Recognition) return;
    if (player.state === 'playing') togglePlay();

    const ta = $('text');
    const start = ta.selectionStart ?? ta.value.length;
    const end = ta.selectionEnd ?? ta.value.length;
    dictation.before = ta.value.slice(0, start);
    dictation.after = ta.value.slice(end);
    dictation.final = '';

    const rec = new Recognition();
    rec.lang = langOf(formAccent);
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          dictation.final = joinText(dictation.final, formatSegment(r[0].transcript));
        } else {
          interim += r[0].transcript;
        }
      }
      writeDictation(interim.trim());
    };

    rec.onerror = (e) => {
      const messages = {
        'not-allowed': 'マイクの使用が許可されていません。ブラウザの設定で許可してください',
        'service-not-allowed': 'この環境では音声入力を利用できません',
        'no-speech': '音声が聞き取れませんでした',
        'audio-capture': 'マイクが見つかりません',
        'network': '音声認識サービスに接続できません'
      };
      if (messages[e.error]) toast(messages[e.error], null, 3600);
    };

    rec.onend = () => {
      dictation.active = false;
      dictation.rec = null;
      writeDictation('');
      setMicUI();
    };

    try {
      rec.start();
      dictation.rec = rec;
      dictation.active = true;
      setMicUI();
    } catch (err) {
      toast('音声入力を開始できませんでした');
    }
  }

  function stopDictation() {
    if (dictation.rec) dictation.rec.stop();
  }

  // ---------- ライブラリ ----------
  function itemMeta(i) {
    const parts = [`${timeLabel(i.createdAt)} 保存`];
    parts.push(i.playCount ? `${i.playCount}回再生` : '未再生');
    if (i.lastPlayedAt) parts.push(`最終 ${relLabel(i.lastPlayedAt)}`);
    if (i.playLog.length >= 2) {
      const a = i.playLog[0].r;
      const b = i.playLog[i.playLog.length - 1].r;
      if (Math.abs(a - b) > 0.001) parts.push(`${fmtRate(a)}x → ${fmtRate(b)}x`);
    }
    return parts.join(' · ');
  }

  function itemHtml(i) {
    const isCurrent = player.itemId === i.id && player.state !== 'idle';
    const isPlaying = isCurrent && player.state === 'playing';
    const sents = splitSentences(i.text);
    const head = sents[0] || i.text;
    const rest = sents.slice(1).join(' ');
    return `
      <div class="item ${isCurrent ? 'playing' : ''} ${editingId === i.id ? 'editing' : ''}">
        <button class="item-play" type="button" data-action="play" data-id="${i.id}" aria-label="${isPlaying ? '一時停止' : '再生'}">
          ${isPlaying ? ICON.pause : ICON.play}
        </button>
        <div class="item-body">
          <div class="item-head">
            <span class="item-title" lang="en">${escapeHtml(head)}</span>
            <span class="tag">${i.settings.accent}</span>
          </div>
          ${rest ? `<div class="item-snippet" lang="en">${escapeHtml(rest)}</div>` : ''}
          <div class="item-meta">${itemMeta(i)}</div>
        </div>
        <div class="item-actions">
          <button class="icon-btn" type="button" data-action="edit" data-id="${i.id}" aria-label="編集">${ICON.edit}</button>
          <button class="icon-btn danger" type="button" data-action="delete" data-id="${i.id}" aria-label="削除">${ICON.trash}</button>
        </div>
      </div>`;
  }

  function renderList() {
    const search = $('search');
    const showSearch = items.length >= 6;
    search.classList.toggle('hidden', !showSearch);
    const q = showSearch ? search.value.trim().toLowerCase() : '';

    const filtered = items
      .filter((i) => !q || i.text.toLowerCase().includes(q))
      .sort((a, b) => b.createdAt - a.createdAt);

    const list = $('list');
    if (!filtered.length) {
      list.innerHTML = `<div class="glass list"><div class="empty">${items.length ? '一致する英文はありません' : '保存した英文は、保存した日ごとにここに並びます'}</div></div>`;
      return;
    }

    const groups = [];
    filtered.forEach((i) => {
      const key = startOfDay(i.createdAt);
      const last = groups[groups.length - 1];
      if (last && last.key === key) last.items.push(i);
      else groups.push({ key, items: [i] });
    });

    list.innerHTML = groups.map((g) => {
      const h = dayHeading(g.key);
      return `
        <div class="group">
          <div class="group-head">
            <span class="group-date">${h.date}</span>
            ${h.rel ? `<span class="group-rel">${h.rel}</span>` : ''}
            <span class="group-count">${g.items.length}件</span>
          </div>
          <div class="glass list">${g.items.map(itemHtml).join('')}</div>
        </div>`;
    }).join('');
  }

  function onListClick(e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const item = items.find((i) => i.id === btn.dataset.id);
    if (!item) return;
    const action = btn.dataset.action;
    if (action === 'play') playItem(item);
    if (action === 'edit') startEdit(item);
    if (action === 'delete') deleteItem(item.id);
  }

  function deleteItem(id) {
    const idx = items.findIndex((i) => i.id === id);
    if (idx < 0) return;
    const [removed] = items.splice(idx, 1);
    if (player.itemId === id) stopPlayback();
    if (editingId === id) resetForm();
    saveItems();
    renderList();
    lastDeleted = { item: removed, index: idx };
    toast(`「${truncate(firstSentence(removed.text), 16)}」を削除しました`, {
      label: '取り消す',
      onClick: () => {
        if (!lastDeleted) return;
        items.splice(Math.min(lastDeleted.index, items.length), 0, lastDeleted.item);
        lastDeleted = null;
        saveItems();
        renderList();
        toast('元に戻しました');
      }
    }, 6000);
  }

  // ---------- 再生エンジン ----------
  const player = {
    sentences: [],
    plan: [],
    step: 0,
    settings: null,
    itemId: null,
    state: 'idle',
    token: 0,
    timer: null,
    estimator: null,
    pendTimer: null,
    gotBoundary: false,
    needGap: false,
    live: [],
    rendered: -1,
    words: [],
    revealedMax: -1,
    nowIdx: -1,
    logEntry: null
  };

  // speak() から実際に話し始めるまでの時間（ミリ秒）。次の文を、この分だけ早めに準備する
  const latency = { avg: 0, n: 0 };

  function recordLatency(ms) {
    const v = Math.min(1500, Math.max(0, ms));
    latency.avg = latency.n ? latency.avg * 0.6 + v * 0.4 : v;
    latency.n += 1;
  }

  function buildPlan(n, repeat) {
    const plan = [];
    for (let s = 0; s < n; s++) {
      for (let r = 0; r < repeat; r++) plan.push({ s, r });
    }
    return plan;
  }

  function curSentence() {
    if (!player.plan.length) return 0;
    return player.plan[Math.min(player.step, player.plan.length - 1)].s;
  }

  function playItem(item) {
    if (player.itemId === item.id && player.state !== 'idle') {
      togglePlay();
      return;
    }
    const entry = { t: Date.now(), r: item.settings.rate };
    item.playLog.push(entry);
    if (item.playLog.length > 500) item.playLog.splice(0, item.playLog.length - 500);
    item.playCount += 1;
    item.lastPlayedAt = entry.t;
    saveItems();
    startPlayback({ text: item.text, settings: { ...item.settings }, itemId: item.id });
    player.logEntry = entry;
  }

  function startPlayback(opts) {
    if (!synth) {
      toast('このブラウザは読み上げに対応していません');
      return;
    }
    const sentences = splitSentences(opts.text);
    if (!sentences.length) return;
    stopDictation();
    Object.assign(player, {
      sentences,
      plan: buildPlan(sentences.length, opts.settings.repeat),
      step: 0,
      settings: opts.settings,
      itemId: opts.itemId,
      rendered: -1,
      logEntry: null
    });
    updatePlayerTitle();
    renderBar();
    showPlayer(true);
    playFrom(0);
    renderList();
  }

  function updatePlayerTitle() {
    if (!player.settings) return;
    const e = findVoice(player.settings);
    $('pTitle').textContent = e ? `${player.settings.accent} · ${e.label}` : player.settings.accent;
  }

  function setPending(on) {
    clearTimeout(player.pendTimer);
    if (on) {
      player.pendTimer = setTimeout(() => $('pPlay').classList.add('pending'), 250);
    } else {
      $('pPlay').classList.remove('pending');
    }
  }

  function clearTimers() {
    clearTimeout(player.timer);
    stopEstimator();
  }

  function interrupt() {
    player.token += 1;
    clearTimers();
    setPending(false);
    player.live = [];
    if (synth && (synth.speaking || synth.pending)) {
      synth.cancel();
      player.needGap = true;
    }
  }

  function playFrom(step) {
    interrupt();
    send(step);
  }

  function send(step) {
    const token = player.token;
    clearTimers();

    if (step >= player.plan.length) {
      if (player.settings.loop) {
        step = 0;
      } else {
        finishPlayback();
        return;
      }
    }

    player.step = step;
    player.state = 'playing';
    const sIdx = player.plan[step].s;
    if (player.rendered !== sIdx) renderSentence(sIdx);
    clearNow();
    updatePlayerUI();

    waitVoices().then(() => {
      if (token !== player.token || player.state !== 'playing') return;
      speakNow(token, makeUtterance(token, step));
    });
  }

  function speakNow(token, u) {
    setPending(true);
    const go = () => {
      if (token !== player.token) return;
      u._queuedAt = performance.now();
      player.live.push(u);
      synth.speak(u);
    };
    // Chrome は cancel() の直後に speak() すると無視することがあるため、そのときだけ少し待つ
    if (player.needGap || synth.speaking || synth.pending) {
      player.needGap = false;
      synth.cancel();
      setTimeout(go, 40);
    } else {
      go();
    }
  }

  // 文と文の間が0秒のときは、次の文を読み上げの待ち行列に先に入れて、途切れずにつなげる
  function prequeue(token, step, current) {
    let next = step + 1;
    if (next >= player.plan.length) {
      if (!player.settings.loop) return;
      next = 0;
    }
    const nu = makeUtterance(token, next);
    nu._prequeued = true;
    current._hasNext = true;
    player.live.push(nu);
    synth.speak(nu);
  }

  function makeUtterance(token, step) {
    const sIdx = player.plan[step].s;
    const text = player.sentences[sIdx];
    const u = new SpeechSynthesisUtterance(text);
    const entry = findVoice(player.settings);
    if (entry) {
      u.voice = entry.v;
      u.lang = (entry.v.lang || '').replace('_', '-') || langOf(player.settings.accent);
    } else {
      u.lang = langOf(player.settings.accent);
    }
    u.rate = player.settings.rate;

    u.onstart = () => {
      if (token !== player.token) return;
      setPending(false);
      if (u._queuedAt && !u._prequeued) recordLatency(performance.now() - u._queuedAt);
      player.step = step;
      if (player.rendered !== sIdx) renderSentence(sIdx);
      clearNow();
      player.gotBoundary = false;
      updatePlayerUI();
      startEstimator(token, step, text.length, u.rate);
      if (player.settings.pause === 0) prequeue(token, step, u);
    };

    u.onboundary = (e) => {
      if (token !== player.token || player.step !== step) return;
      if (e.name && e.name !== 'word') return;
      player.gotBoundary = true;
      stopEstimator();
      reveal(e.charIndex);
    };

    u.onend = () => {
      if (token !== player.token || player.state !== 'playing') return;
      stopEstimator();
      revealAll();
      if (u._hasNext) return;
      const next = step + 1;
      if (next >= player.plan.length && !player.settings.loop) {
        finishPlayback();
        return;
      }
      const wait = Math.max(0, player.settings.pause * 1000 - latency.avg);
      player.timer = setTimeout(() => {
        if (token === player.token && player.state === 'playing') send(next);
      }, wait);
    };

    u.onerror = (e) => {
      if (token !== player.token) return;
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      stopEstimator();
      setPending(false);
      const retryable = ['synthesis-failed', 'synthesis-unavailable', 'network', 'voice-unavailable', 'language-unavailable'];
      if (entry && retryable.includes(e.error)) {
        failedVoices.add(entry.v.voiceURI);
        loadVoices();
        if (findVoice(player.settings)) {
          toast('選んだ声を使えなかったため、別の声で再生しています', null, 3200);
          updatePlayerTitle();
          playFrom(step);
          return;
        }
      }
      player.state = 'paused';
      updatePlayerUI();
      renderList();
      toast(`読み上げに失敗しました（${e.error}）`);
    };

    return u;
  }

  function startEstimator(token, step, length, rate) {
    stopEstimator();
    const charsPerSec = 14 * rate;
    const t0 = performance.now();
    player.estimator = setTimeout(function tick() {
      if (token !== player.token || player.step !== step || player.gotBoundary) return;
      const ci = Math.floor(((performance.now() - t0) / 1000) * charsPerSec);
      reveal(Math.min(ci, length));
      player.estimator = setTimeout(tick, 80);
    }, 350);
  }

  function stopEstimator() {
    clearTimeout(player.estimator);
    player.estimator = null;
  }

  function renderSentence(sIdx) {
    const s = player.sentences[sIdx];
    const el = $('pSentence');
    let html = '';
    let last = 0;
    s.replace(/\S+/g, (m, offset) => {
      html += escapeHtml(s.slice(last, offset)) + `<span class="w" data-s="${offset}">${escapeHtml(m)}</span>`;
      last = offset + m.length;
      return m;
    });
    html += escapeHtml(s.slice(last));
    el.innerHTML = html;
    el.scrollTop = 0;
    player.words = [...el.querySelectorAll('.w')].map((w) => ({ el: w, start: Number(w.dataset.s) }));
    player.rendered = sIdx;
    player.revealedMax = -1;
    player.nowIdx = -1;
  }

  function reveal(charIndex) {
    const words = player.words;
    let k = -1;
    for (let i = 0; i < words.length; i++) {
      if (words[i].start <= charIndex) k = i;
      else break;
    }
    if (k < 0) return;
    for (let i = player.revealedMax + 1; i <= k; i++) words[i].el.classList.add('clear');
    player.revealedMax = Math.max(player.revealedMax, k);
    if (k !== player.nowIdx) {
      if (player.nowIdx >= 0 && words[player.nowIdx]) words[player.nowIdx].el.classList.remove('now');
      words[k].el.classList.add('now');
      player.nowIdx = k;
    }
  }

  function clearNow() {
    if (player.nowIdx >= 0 && player.words[player.nowIdx]) {
      player.words[player.nowIdx].el.classList.remove('now');
    }
    player.nowIdx = -1;
  }

  function revealAll() {
    player.words.forEach((w) => w.el.classList.add('clear'));
    player.revealedMax = player.words.length - 1;
    clearNow();
  }

  function finishPlayback() {
    clearTimers();
    setPending(false);
    player.state = 'done';
    player.step = player.plan.length - 1;
    revealAll();
    updatePlayerUI();
    renderList();
  }

  function togglePlay() {
    if (player.state === 'playing') {
      player.state = 'paused';
      interrupt();
      clearNow();
    } else if (player.state === 'paused') {
      playFrom(player.step);
    } else if (player.state === 'done') {
      player.rendered = -1;
      playFrom(0);
    }
    updatePlayerUI();
    renderList();
  }

  function jumpTo(sIdx) {
    if (!player.sentences.length) return;
    const wasPlaying = player.state === 'playing';
    const s = Math.max(0, Math.min(sIdx, player.sentences.length - 1));
    playFrom(s * player.settings.repeat);
    if (!wasPlaying) renderList();
  }

  function stopPlayback() {
    interrupt();
    player.state = 'idle';
    player.itemId = null;
    player.logEntry = null;
    showPlayer(false);
    renderList();
  }

  function showPlayer(on) {
    const p = $('player');
    p.classList.toggle('show', on);
    p.setAttribute('aria-hidden', String(!on));
    document.body.classList.toggle('has-player', on);
    $('pSentence').dataset.mode = prefs.display;
  }

  function renderBar() {
    const bar = $('pBar');
    const n = player.sentences.length;
    bar.classList.toggle('dense', n > 40);
    bar.innerHTML = player.sentences
      .map((_, i) => `<button type="button" data-index="${i}" aria-label="${i + 1}文目"></button>`)
      .join('');
  }

  function updatePlayerUI() {
    const n = player.sentences.length;
    if (!n) return;
    const idx = curSentence();
    const rep = player.plan[Math.min(player.step, player.plan.length - 1)].r;
    const done = player.state === 'done';

    [...$('pBar').children].forEach((seg, i) => {
      seg.classList.toggle('done', done || i < idx);
      seg.classList.toggle('current', !done && i === idx);
    });

    let progress = `${idx + 1} / ${n}`;
    if (player.settings.repeat > 1 && !done) {
      progress += ` · ${rep + 1}/${player.settings.repeat}回目`;
    }
    $('pProgress').textContent = progress;

    const playBtn = $('pPlay');
    if (player.state === 'playing') {
      playBtn.innerHTML = ICON.pause;
      playBtn.setAttribute('aria-label', '一時停止');
    } else if (done) {
      playBtn.innerHTML = ICON.replay;
      playBtn.setAttribute('aria-label', '最初から再生');
    } else {
      playBtn.innerHTML = ICON.play;
      playBtn.setAttribute('aria-label', '再生');
    }

    $('pPrev').disabled = idx === 0 && !done;
    $('pNext').disabled = idx >= n - 1;
    $('pRate').textContent = `${fmtRate(player.settings.rate)}x`;
    $('pMode').textContent = MODE_LABEL[prefs.display];
  }

  function cycleRate() {
    const cur = player.settings.rate;
    const next = RATES.find((r) => r > cur + 0.001) ?? RATES[0];
    player.settings.rate = next;

    if (player.itemId) {
      const it = items.find((i) => i.id === player.itemId);
      if (it) {
        it.settings.rate = next;
        if (player.logEntry) player.logEntry.r = next;
        saveItems();
        renderList();
      }
    } else {
      $('rate').value = next;
      onFormChange();
    }

    if (player.state === 'playing') {
      jumpTo(curSentence());
    } else {
      updatePlayerUI();
    }
  }

  function cycleMode() {
    prefs.display = MODES[(MODES.indexOf(prefs.display) + 1) % MODES.length];
    savePrefs();
    $('pSentence').dataset.mode = prefs.display;
    updatePlayerUI();
  }

  // ---------- 初期化 ----------
  function init() {
    $('btnMic').innerHTML = ICON.mic;
    $('selectChevron').innerHTML = ICON.chevron;
    $('summaryChevron').innerHTML = ICON.chevron;
    $('pClose').innerHTML = ICON.close;
    $('pPrev').innerHTML = ICON.prev;
    $('pNext').innerHTML = ICON.next;

    applyTheme();
    $('btnTheme').addEventListener('click', cycleTheme);

    accentSeg = setupSegmented($('accentSeg'), formAccent, (v) => {
      formAccent = v;
      renderVoiceSelect();
      onFormChange();
      if (dictation.active) setMicUI();
      if (player.state !== 'playing') warmUp(findVoice(getFormSettings()));
    });

    repeatSeg = setupSegmented($('repeatSeg'), formRepeat, (v) => {
      formRepeat = Number(v);
      onFormChange();
    });

    applyFormSettings(settingsFromPrefs());

    if (!synth) {
      $('unsupported').classList.remove('hidden');
    } else {
      loadVoices();
      synth.addEventListener('voiceschanged', loadVoices);
      document.addEventListener('pointerdown', () => {
        if (player.state !== 'playing') warmUp(findVoice(getFormSettings()));
      }, { once: true, capture: true });
    }

    if (Recognition) {
      $('btnMic').classList.remove('hidden');
      $('btnMic').addEventListener('click', () => {
        if (dictation.active) stopDictation();
        else startDictation();
      });
    }

    $('voice').addEventListener('change', (e) => {
      formVoice[formAccent] = e.target.value;
      onFormChange();
      if (player.state !== 'playing') warmUp(findVoice(getFormSettings()));
    });
    ['rate', 'pause'].forEach((id) => $(id).addEventListener('input', onFormChange));
    $('loop').addEventListener('change', onFormChange);
    $('text').addEventListener('input', updateLabels);

    $('btnPreview').addEventListener('click', () => {
      startPlayback({
        text: $('text').value,
        settings: getFormSettings(),
        itemId: null
      });
    });
    $('btnSave').addEventListener('click', saveCurrent);
    $('btnCancelEdit').addEventListener('click', resetForm);

    $('list').addEventListener('click', onListClick);
    $('search').addEventListener('input', renderList);

    $('pPlay').addEventListener('click', togglePlay);
    $('pPrev').addEventListener('click', () => {
      jumpTo(player.state === 'done' ? player.sentences.length - 1 : curSentence() - 1);
    });
    $('pNext').addEventListener('click', () => jumpTo(curSentence() + 1));
    $('pClose').addEventListener('click', stopPlayback);
    $('pRate').addEventListener('click', cycleRate);
    $('pMode').addEventListener('click', cycleMode);
    $('pBar').addEventListener('click', (e) => {
      const seg = e.target.closest('button[data-index]');
      if (seg) jumpTo(Number(seg.dataset.index));
    });

    const sentenceEl = $('pSentence');
    const peekOn = () => sentenceEl.classList.add('peek');
    const peekOff = () => sentenceEl.classList.remove('peek');
    sentenceEl.addEventListener('pointerdown', peekOn);
    sentenceEl.addEventListener('pointerup', peekOff);
    sentenceEl.addEventListener('pointerleave', peekOff);
    sentenceEl.addEventListener('pointercancel', peekOff);

    document.addEventListener('keydown', (e) => {
      if (!$('player').classList.contains('show')) return;
      const t = e.target;
      const inField = t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
      if (inField) return;
      if (e.code === 'Space' && !(t.closest && t.closest('button'))) {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        jumpTo(curSentence() - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        jumpTo(curSentence() + 1);
      } else if (e.key === 'Escape') {
        stopPlayback();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderList();
    });

    window.addEventListener('beforeunload', () => {
      if (synth) synth.cancel();
    });

    renderList();
  }

  init();
})();
</script>
</body>
</html>
