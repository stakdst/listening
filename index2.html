  }

  .p-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: -8px;
  }

  .p-title {
    flex: 1;
    min-width: 0;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .p-progress {
    font-size: 0.82rem;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .p-sentence {
    min-height: 4.5em;
    max-height: 36vh;
    overflow-y: auto;
    margin: 10px 0 0;
    font-size: clamp(1.3rem, 3.4vw, 1.6rem);
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: -0.012em;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  .p-sentence .w {
    display: inline-block;
    transition: filter 0.5s var(--ease), opacity 0.5s var(--ease), color 0.25s;
  }

  .p-sentence[data-mode="follow"] .w:not(.clear) {
    filter: blur(7px);
    opacity: 0.5;
  }

  .p-sentence[data-mode="hide"] .w {
    filter: blur(9px);
    opacity: 0.42;
  }

  .p-sentence:not([data-mode="hide"]) .w.now { color: var(--accent); }

  .p-sentence.peek .w {
    filter: none !important;
    opacity: 1 !important;
  }

  .p-bar {
    display: flex;
    gap: 3px;
    margin: 14px 0 8px;
  }

  .p-bar.dense { gap: 1px; }

  .p-bar button {
    flex: 1;
    min-width: 2px;
    height: 18px;
    padding: 7px 0;
  }

  .p-bar button::after {
    content: "";
    display: block;
    height: 4px;
    border-radius: 2px;
    background: var(--track);
    transition: background-color 0.3s;
  }

  .p-bar button.done::after { background: var(--faint); }

  .p-bar button.current::after { background: var(--accent); }

  .p-controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
  }

  .p-transport {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .p-transport .icon-btn {
    width: 44px;
    height: 44px;
    color: var(--text);
  }

  .p-transport .icon-btn svg { width: 24px; height: 24px; }

  .play-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 8px 22px color-mix(in srgb, var(--accent) 38%, transparent);
    transition: transform 0.15s var(--ease);
  }

  .play-btn svg { width: 26px; height: 26px; }

  .play-btn:active { transform: scale(0.94); }

  .chip {
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    background: var(--seg-bg);
    font-size: 0.8rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: transform 0.15s var(--ease), background-color 0.2s;
  }

  .chip:active { transform: scale(0.95); }

  .p-controls .chip:first-child { justify-self: start; }

  .p-controls .chip:last-child { justify-self: end; }

  /* ---------- トースト ---------- */
  .toast {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: calc(100% - 32px);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -10px);
    transition: opacity 0.25s var(--ease), transform 0.35s var(--ease);
  }

  .toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }

  .toast .link { font-weight: 600; white-space: nowrap; }

  @media (max-width: 480px) {
    .card { padding: 16px; }
    .voice-row { grid-template-columns: 112px 1fr; }
    .setting-inline .segmented { width: 168px; }
    .player { padding: 14px 16px 16px; border-radius: 28px; }
    .p-transport { gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main>
  <header class="hero">
    <div class="hero-row">
      <h1>Listening</h1>
      <button id="btnTheme" class="round-btn glass" type="button"></button>
    </div>
    <input id="purpose" class="purpose" type="text" maxlength="80" placeholder="このアプリを使う目的（任意）" aria-label="目的">
  </header>

  <section class="glass card" id="composer">
    <div class="card-head">
      <h2 id="composerHeading">新しい英文</h2>
      <button id="btnCancelEdit" class="link hidden" type="button">キャンセル</button>
    </div>

    <p id="unsupported" class="notice hidden">このブラウザは読み上げに対応していません。Chrome、Edge、Safari の最新版で開いてください。</p>

    <div class="stack">
      <input id="title" class="field" type="text" placeholder="タイトル（任意）" aria-label="タイトル">

      <div class="textwrap" id="textwrap">
        <textarea id="text" class="field" placeholder="Type or dictate English here." aria-label="英文" spellcheck="true" lang="en"></textarea>
        <button id="btnMic" class="mic hidden" type="button" aria-label="音声入力" aria-pressed="false"></button>
      </div>
      <div class="countline" id="countline" aria-live="polite"></div>

      <div class="voice-row">
        <div class="segmented" id="accentSeg" role="group" aria-label="アクセント">
          <span class="seg-thumb"></span>
          <button type="button" data-value="US">US</button>
          <button type="button" data-value="UK">UK</button>
        </div>
        <div class="select-wrap">
          <select id="voice" class="field" aria-label="声"></select>
          <span id="selectChevron"></span>
        </div>
      </div>

      <details class="settings" id="settings">
        <summary>
          <span>再生設定</span>
          <span class="summary-value" id="settingsSummary"></span>
          <span id="summaryChevron"></span>
        </summary>
        <div class="settings-body">
          <div>
            <div class="setting-head">
              <label for="rate">速さ</label>
              <output id="rateVal" for="rate"></output>
            </div>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.05">
          </div>
          <div>
            <div class="setting-head">
              <label for="pause">文と文の間</label>
              <output id="pauseVal" for="pause"></output>
            </div>
            <input type="range" id="pause" min="0" max="5" step="0.5">
          </div>
          <div class="setting-inline">
            <span>1文の繰り返し</span>
            <div class="segmented small" id="repeatSeg" role="group" aria-label="1文の繰り返し">
              <span class="seg-thumb"></span>
              <button type="button" data-value="1">1回</button>
              <button type="button" data-value="2">2回</button>
              <button type="button" data-value="3">3回</button>
              <button type="button" data-value="5">5回</button>
            </div>
          </div>
          <label class="setting-inline">
            <span>最後まで再生したら最初から</span>
            <span class="switch"><input type="checkbox" id="loop"><span></span></span>
          </label>
        </div>
      </details>

      <div class="actions">
        <button id="btnPreview" class="btn" type="button">試聴</button>
        <button id="btnSave" class="btn primary" type="button">保存</button>
      </div>
    </div>
  </section>

  <section>
    <div class="card-head">
      <h2>ライブラリ</h2>
      <span id="libFacts" class="facts"></span>
    </div>
    <input id="search" class="field search hidden" type="search" placeholder="検索" aria-label="検索">
    <div id="list" class="glass list"></div>
    <div class="backup">
      <span>バックアップ</span>
      <button id="btnExport" class="link" type="button">書き出す</button>
      <span aria-hidden="true">·</span>
      <button id="btnImport" class="link" type="button">読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    </div>
  </section>
</main>

<div id="player" class="player glass" role="region" aria-label="プレーヤー" aria-hidden="true">
  <div class="p-top">
    <div class="p-title" id="pTitle"></div>
    <div class="p-progress" id="pProgress"></div>
    <button id="pClose" class="icon-btn" type="button" aria-label="閉じる"></button>
  </div>
  <div class="p-sentence" id="pSentence" data-mode="follow" lang="en"></div>
  <div class="p-bar" id="pBar"></div>
  <div class="p-controls">
    <button id="pRate" class="chip" type="button" aria-label="速さを変更"></button>
    <div class="p-transport">
      <button id="pPrev" class="icon-btn" type="button" aria-label="前の文"></button>
      <button id="pPlay" class="play-btn" type="button"></button>
      <button id="pNext" class="icon-btn" type="button" aria-label="次の文"></button>
    </div>
    <button id="pMode" class="chip" type="button" aria-label="英文の表示方法を変更"></button>
  </div>
</div>

<div id="toast" class="toast glass" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const ITEMS_KEY = 'listeningMaker.items.v1';
  const PREFS_KEY = 'listeningMaker.prefs.v1';
  const $ = (id) => document.getElementById(id);
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  const STROKE = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
    replay: `<svg viewBox="0 0 24 24" ${STROKE} stroke-width="2"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>`,
    prev: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.4" height="14" rx="1"/><path d="M19 6.2v11.6a.9.9 0 0 1-1.38.76L9.3 13.3a1.5 1.5 0 0 1 0-2.6l8.32-5.26A.9.9 0 0 1 19 6.2z"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="16.6" y="5" width="2.4" height="14" rx="1"/><path d="M5 6.2v11.6a.9.9 0 0 0 1.38.76l8.32-5.26a1.5 1.5 0 0 0 0-2.6L6.38 5.44A.9.9 0 0 0 5 6.2z"/></svg>',
    close: `<svg viewBox="0 0 24 24" ${STROKE} stroke-width="2"><path d="M7 7l10 10M17 7L7 17"/></svg>`,
    mic: `<svg viewBox="0 0 24 24" ${STROKE}><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>`,
    edit: `<svg viewBox="0 0 24 24" ${STROKE}><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>`,
    trash: `<svg viewBox="0 0 24 24" ${STROKE}><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`,
    sun: `<svg viewBox="0 0 24 24" ${STROKE}><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`,
    moon: `<svg viewBox="0 0 24 24" ${STROKE}><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`,
    auto: `<svg viewBox="0 0 24 24" ${STROKE}><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>`,
    chevron: `<svg viewBox="0 0 24 24" ${STROKE} stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>`
  };

  const THEMES = ['system', 'light', 'dark'];
  const THEME_LABEL = { system: '自動', light: 'ライト', dark: 'ダーク' };
  const MODES = ['follow', 'all', 'hide'];
  const MODE_LABEL = { follow: '声に合わせる', all: '常に表示', hide: '隠す' };
  const RATES = [0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.3];
  const ABBR = /\b(?:Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|e\.g|i\.e)\.$/i;

  const DEFAULT_PREFS = {
    theme: 'system',
    accent: 'US',
    voice: { US: '', UK: '' },
    rate: 1,
    pause: 1,
    repeat: 1,
    loop: false,
    display: 'follow',
    purpose: ''
  };

  // ---------- 保存 ----------
  function loadJSON(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  function loadPrefs() {
    const p = loadJSON(PREFS_KEY, {});
    return {
      ...DEFAULT_PREFS,
      ...p,
      voice: { ...DEFAULT_PREFS.voice, ...(p.voice || {}) }
    };
  }

  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    } catch (e) {}
  }

  function clampNum(v, min, max, fallback) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function normalizeItem(i) {
    const s = i.settings || {};
    const accent = s.accent === 'US' || s.accent === 'UK'
      ? s.accent
      : (/(en-GB|\bUK\b|British|United Kingdom)/i.test(s.voiceName || '') ? 'UK' : 'US');
    const created = Number(i.createdAt) || Date.now();
    const text = String(i.text);
    return {
      id: String(i.id),
      title: String(i.title || '').trim() || autoTitle(text),
      text,
      settings: {
        accent,
        voiceURI: s.voiceURI || '',
        voiceName: s.voiceName || '',
        rate: clampNum(s.rate, 0.5, 1.5, 1),
        pause: clampNum(s.pause, 0, 5, 1),
        repeat: [1, 2, 3, 5].includes(Number(s.repeat)) ? Number(s.repeat) : 1,
        loop: !!s.loop
      },
      createdAt: created,
      updatedAt: Number(i.updatedAt) || created,
      lastPlayedAt: Number(i.lastPlayedAt) || null,
      playCount: Number(i.playCount) || 0,
      playLog: Array.isArray(i.playLog)
        ? i.playLog.filter((e) => e && e.t).map((e) => ({ t: Number(e.t), r: Number(e.r) || 1 }))
        : []
    };
  }

  function loadItems() {
    const raw = loadJSON(ITEMS_KEY, []);
    if (!Array.isArray(raw)) return [];
    return raw.filter((i) => i && i.id && i.text).map(normalizeItem);
  }

  function saveItems() {
    try {
      localStorage.setItem(ITEMS_KEY, JSON.stringify(items));
      return true;
    } catch (e) {
      toast('保存できませんでした。ブラウザの保存容量を確認してください');
      return false;
    }
  }

  const prefs = loadPrefs();
  let items = loadItems();
  let editingId = null;
  let formAccent = prefs.accent;
  let formRepeat = prefs.repeat;
  let formVoice = { ...prefs.voice };
  let voicesByAccent = { US: [], UK: [] };
  let lastDeleted = null;
  let accentSeg = null;
  let repeatSeg = null;

  // ---------- ユーティリティ ----------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function truncate(s, n) {
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function autoTitle(text) {
    const first = splitSentences(text)[0] || text.trim();
    return truncate(first, 40);
  }

  function fmtRate(r) {
    return Number(r).toFixed(2).replace(/0$/, '');
  }

  function splitSentences(text) {
    const cleaned = String(text).replace(/\s+/g, ' ').trim();
    if (!cleaned) return [];
    const parts = cleaned.split(/(?<=[.!?]["'”’)\]]*)\s+/);
    const out = [];
    parts.forEach((p) => {
      if (out.length && ABBR.test(out[out.length - 1])) {
        out[out.length - 1] += ' ' + p;
      } else {
        out.push(p);
      }
    });
    return out.filter(Boolean);
  }

  function countWords(text) {
    const t = text.trim();
    return t ? t.split(/\s+/).length : 0;
  }

  function startOfDay(ts) {
    const d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }

  function dateLabel(ts) {
    const d = new Date(ts);
    const md = `${d.getMonth() + 1}/${d.getDate()}`;
    return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}/${md}`;
  }

  function relLabel(ts) {
    const diff = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000);
    if (diff <= 0) return '今日';
    if (diff === 1) return '昨日';
    if (diff < 7) return `${diff}日前`;
    return dateLabel(ts);
  }

  let toastTimer = null;
  function toast(msg, action, duration) {
    const t = $('toast');
    t.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = msg;
    t.appendChild(span);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'link';
      b.textContent = action.label;
      b.addEventListener('click', () => {
        t.classList.remove('show');
        action.onClick();
      });
      t.appendChild(b);
    }
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration || 2400);
  }

  // ---------- テーマ ----------
  function applyTheme() {
    const root = document.documentElement;
    if (prefs.theme === 'system') {
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', prefs.theme);
    }
    const b = $('btnTheme');
    const icon = prefs.theme === 'system' ? 'auto' : prefs.theme === 'light' ? 'sun' : 'moon';
    b.innerHTML = ICON[icon];
    b.setAttribute('aria-label', `表示モード: ${THEME_LABEL[prefs.theme]}`);
    b.title = `表示モード: ${THEME_LABEL[prefs.theme]}`;
  }

  function cycleTheme() {
    prefs.theme = THEMES[(THEMES.indexOf(prefs.theme) + 1) % THEMES.length];
    savePrefs();
    applyTheme();
    toast(`表示モード: ${THEME_LABEL[prefs.theme]}`);
  }

  // ---------- セグメント ----------
  function setupSegmented(el, value, onChange) {
    const btns = [...el.querySelectorAll('button')];
    el.style.setProperty('--n', btns.length);
    const set = (v, emit) => {
      const i = Math.max(0, btns.findIndex((b) => b.dataset.value === String(v)));
      el.style.setProperty('--i', i);
      btns.forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
      if (emit) onChange(btns[i].dataset.value);
    };
    btns.forEach((b) => b.addEventListener('click', () => set(b.dataset.value, true)));
    set(value, false);
    return { set: (v) => set(v, false) };
  }

  // ---------- 音声一覧 ----------
  function accentOf(v) {
    const l = (v.lang || '').replace('_', '-').toLowerCase();
    if (l.startsWith('en-us')) return 'US';
    if (l.startsWith('en-gb')) return 'UK';
    return null;
  }

  function voiceScore(v) {
    let s = 0;
    if (/natural|neural/i.test(v.name)) s += 4;
    if (/premium|enhanced/i.test(v.name)) s += 3;
    if (/google/i.test(v.name)) s += 2;
    if (v.localService) s += 1;
    return s;
  }

  function displayName(v) {
    return v.name
      .replace(/^Microsoft\s+/i, '')
      .replace(/\s*-\s*English.*$/i, '')
      .replace(/\s+Online\b/i, '')
      .replace(/\s*\(Natural\)/i, ' · Natural')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function loadVoices() {
    if (!synth) return;
    const next = { US: [], UK: [] };
    synth.getVoices().forEach((v) => {
      const a = accentOf(v);
      if (a) next[a].push(v);
    });
    Object.keys(next).forEach((k) => {
      next[k].sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name));
    });
    voicesByAccent = next;
    renderVoiceSelect();
  }

  function renderVoiceSelect() {
    const sel = $('voice');
    const list = voicesByAccent[formAccent];
    const want = formVoice[formAccent];
    sel.innerHTML = '';
    if (!list.length) {
      sel.add(new Option('標準の声', ''));
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    list.forEach((v) => sel.add(new Option(displayName(v), v.voiceURI)));
    sel.value = list.some((v) => v.voiceURI === want) ? want : list[0].voiceURI;
  }

  function findVoice(settings) {
    const list = voicesByAccent[settings.accent] || [];
    return list.find((v) => v.voiceURI === settings.voiceURI)
      || list.find((v) => v.name === settings.voiceName)
      || list[0]
      || null;
  }

  function langOf(accent) {
    return accent === 'UK' ? 'en-GB' : 'en-US';
  }

  // ---------- フォーム ----------
  function getFormSettings() {
    const sel = $('voice');
    const v = voicesByAccent[formAccent].find((x) => x.voiceURI === sel.value);
    return {
      accent: formAccent,
      voiceURI: v ? v.voiceURI : '',
      voiceName: v ? v.name : '',
      rate: Number($('rate').value),
      pause: Number($('pause').value),
      repeat: Number(formRepeat),
      loop: $('loop').checked
    };
  }

  function applyFormSettings(s) {
    formAccent = s.accent;
    formRepeat = s.repeat;
    accentSeg.set(s.accent);
    repeatSeg.set(s.repeat);
    $('rate').value = s.rate;
    $('pause').value = s.pause;
    $('loop').checked = !!s.loop;
    renderVoiceSelect();
    updateLabels();
  }

  function setRangeFill(el) {
    const min = Number(el.min);
    const max = Number(el.max);
    el.style.setProperty('--p', ((Number(el.value) - min) / (max - min)) * 100 + '%');
  }

  function updateLabels() {
    const rate = Number($('rate').value);
    const pause = Number($('pause').value);
    $('rateVal').textContent = `${fmtRate(rate)}x`;
    $('pauseVal').textContent = `${pause}秒`;
    setRangeFill($('rate'));
    setRangeFill($('pause'));
    $('settingsSummary').textContent =
      `${fmtRate(rate)}x · ${pause}秒 · ${formRepeat}回${$('loop').checked ? ' · ループ' : ''}`;

    const text = $('text').value;
    const empty = !text.trim();
    if (!dictation.active) {
      $('countline').textContent = empty ? '' : `${splitSentences(text).length}文 · ${countWords(text)}語`;
    }
    $('btnSave').disabled = empty;
    $('btnPreview').disabled = empty || !synth;
  }

  function onFormChange() {
    updateLabels();
    if (editingId) return;
    const s = getFormSettings();
    prefs.accent = s.accent;
    prefs.rate = s.rate;
    prefs.pause = s.pause;
    prefs.repeat = s.repeat;
    prefs.loop = s.loop;
    prefs.voice = { ...prefs.voice, ...formVoice };
    savePrefs();
  }

  function settingsFromPrefs() {
    return {
      accent: prefs.accent,
      rate: prefs.rate,
      pause: prefs.pause,
      repeat: prefs.repeat,
      loop: prefs.loop
    };
  }

  function resetForm() {
    editingId = null;
    $('title').value = '';
    $('text').value = '';
    $('composerHeading').textContent = '新しい英文';
    $('btnSave').textContent = '保存';
    $('btnCancelEdit').classList.add('hidden');
    formVoice = { ...prefs.voice };
    applyFormSettings(settingsFromPrefs());
    renderList();
  }

  function startEdit(item) {
    stopDictation();
    editingId = item.id;
    $('title').value = item.title;
    $('text').value = item.text;
    formVoice = { ...prefs.voice, [item.settings.accent]: item.settings.voiceURI };
    applyFormSettings(item.settings);
    $('composerHeading').textContent = '編集中';
    $('btnSave').textContent = '更新';
    $('btnCancelEdit').classList.remove('hidden');
    renderList();
    $('composer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => $('text').focus({ preventScroll: true }), 350);
  }

  function saveCurrent() {
    const text = $('text').value.trim();
    if (!text) return;
    stopDictation();
    const title = $('title').value.trim() || autoTitle(text);
    const settings = getFormSettings();
    const now = Date.now();

    if (editingId) {
      const it = items.find((i) => i.id === editingId);
      if (it) Object.assign(it, { title, text, settings, updatedAt: now });
      if (saveItems()) toast('更新しました');
    } else {
      items.push(normalizeItem({ id: uid(), title, text, settings, createdAt: now, updatedAt: now }));
      if (saveItems()) toast('保存しました');
    }
    resetForm();
  }

  // ---------- 音声入力 ----------
  const dictation = { rec: null, active: false, before: '', after: '', final: '' };

  function joinText(a, b) {
    return a && b ? `${a} ${b}` : (a || b);
  }

  function formatSegment(t) {
    let s = t.trim();
    if (!s) return '';
    s = s.replace(/\bi\b/g, 'I');
    s = s.charAt(0).toUpperCase() + s.slice(1);
    if (!/[.!?]["'”’)]?$/.test(s)) s += '.';
    return s;
  }

  function writeDictation(interim) {
    const ta = $('text');
    const mid = joinText(dictation.final, interim);
    const before = dictation.before;
    const after = dictation.after;
    const sepB = before && mid && !/\s$/.test(before) ? ' ' : '';
    const sepA = after && mid && !/^\s/.test(after) ? ' ' : '';
    ta.value = before + sepB + mid + sepA + after;
    const caret = (before + sepB + mid).length;
    try {
      ta.setSelectionRange(caret, caret);
    } catch (e) {}
    updateLabels();
  }

  function setMicUI() {
    const on = dictation.active;
    const btn = $('btnMic');
    btn.classList.toggle('recording', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? '音声入力を停止' : '音声入力');
    $('textwrap').classList.toggle('recording', on);
    const cl = $('countline');
    cl.classList.toggle('recording', on);
    if (on) {
      cl.textContent = `聞き取り中（${formAccent}）`;
    } else {
      updateLabels();
    }
  }

  function startDictation() {
    if (!Recognition) return;
    if (player.state === 'playing') togglePlay();

    const ta = $('text');
    const start = ta.selectionStart ?? ta.value.length;
    const end = ta.selectionEnd ?? ta.value.length;
    dictation.before = ta.value.slice(0, start);
    dictation.after = ta.value.slice(end);
    dictation.final = '';

    const rec = new Recognition();
    rec.lang = langOf(formAccent);
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          dictation.final = joinText(dictation.final, formatSegment(r[0].transcript));
        } else {
          interim += r[0].transcript;
        }
      }
      writeDictation(interim.trim());
    };

    rec.onerror = (e) => {
      const messages = {
        'not-allowed': 'マイクの使用が許可されていません。ブラウザの設定で許可してください',
        'service-not-allowed': 'この環境では音声入力を利用できません',
        'no-speech': '音声が聞き取れませんでした',
        'audio-capture': 'マイクが見つかりません',
        'network': '音声認識サービスに接続できません'
      };
      if (messages[e.error]) toast(messages[e.error], null, 3600);
    };

    rec.onend = () => {
      dictation.active = false;
      dictation.rec = null;
      writeDictation('');
      setMicUI();
    };

    try {
      rec.start();
      dictation.rec = rec;
      dictation.active = true;
      setMicUI();
    } catch (err) {
      toast('音声入力を開始できませんでした');
    }
  }

  function stopDictation() {
    if (dictation.rec) dictation.rec.stop();
  }

  // ---------- ライブラリ ----------
  function renderFacts() {
    if (!items.length) {
      $('libFacts').textContent = '';
      return;
    }
    const plays = items.reduce((n, i) => n + (i.playCount || 0), 0);
    const first = Math.min(...items.map((i) => i.createdAt));
    $('libFacts').textContent = `${items.length}件 · 再生${plays}回 · ${dateLabel(first)}から`;
  }

  function itemMeta(i) {
    const parts = [`${dateLabel(i.createdAt)} 作成`];
    parts.push(i.playCount ? `${i.playCount}回再生` : '未再生');
    if (i.lastPlayedAt) parts.push(`最終 ${relLabel(i.lastPlayedAt)}`);
    if (i.playLog.length >= 2) {
      const a = i.playLog[0].r;
      const b = i.playLog[i.playLog.length - 1].r;
      if (Math.abs(a - b) > 0.001) parts.push(`${fmtRate(a)}x → ${fmtRate(b)}x`);
    }
    return parts.join(' · ');
  }

  function renderList() {
    renderFacts();
    const search = $('search');
    search.classList.toggle('hidden', items.length < 6);
    const q = items.length >= 6 ? search.value.trim().toLowerCase() : '';

    const filtered = items
      .filter((i) => !q || i.title.toLowerCase().includes(q) || i.text.toLowerCase().includes(q))
      .sort((a, b) => b.createdAt - a.createdAt);

    const list = $('list');
    if (!filtered.length) {
      list.innerHTML = `<div class="empty">${items.length ? '一致する英文はありません' : '保存した英文はここに並びます'}</div>`;
      return;
    }

    list.innerHTML = filtered.map((i) => {
      const isCurrent = player.itemId === i.id && player.state !== 'idle';
      const isPlaying = isCurrent && player.state === 'playing';
      const titleBase = i.title.replace(/…$/, '');
      const showSnippet = !i.text.startsWith(titleBase);
      return `
        <div class="item ${isCurrent ? 'playing' : ''} ${editingId === i.id ? 'editing' : ''}">
          <button class="item-play" type="button" data-action="play" data-id="${i.id}" aria-label="${isPlaying ? '一時停止' : '再生'}">
            ${isPlaying ? ICON.pause : ICON.play}
          </button>
          <div class="item-body">
            <div class="item-title">${escapeHtml(i.title)}<span class="tag">${i.settings.accent}</span></div>
            ${showSnippet ? `<div class="item-snippet" lang="en">${escapeHtml(i.text)}</div>` : ''}
            <div class="item-meta">${itemMeta(i)}</div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" type="button" data-action="edit" data-id="${i.id}" aria-label="編集">${ICON.edit}</button>
            <button class="icon-btn danger" type="button" data-action="delete" data-id="${i.id}" aria-label="削除">${ICON.trash}</button>
          </div>
        </div>`;
    }).join('');
  }

  function onListClick(e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const item = items.find((i) => i.id === btn.dataset.id);
    if (!item) return;
    const action = btn.dataset.action;
    if (action === 'play') playItem(item);
    if (action === 'edit') startEdit(item);
    if (action === 'delete') deleteItem(item.id);
  }

  function deleteItem(id) {
    const idx = items.findIndex((i) => i.id === id);
    if (idx < 0) return;
    const [removed] = items.splice(idx, 1);
    if (player.itemId === id) stopPlayback();
    if (editingId === id) resetForm();
    saveItems();
    renderList();
    lastDeleted = { item: removed, index: idx };
    toast(`「${truncate(removed.title, 16)}」を削除しました`, {
      label: '取り消す',
      onClick: () => {
        if (!lastDeleted) return;
        items.splice(Math.min(lastDeleted.index, items.length), 0, lastDeleted.item);
        lastDeleted = null;
        saveItems();
        renderList();
        toast('元に戻しました');
      }
    }, 6000);
  }

  // ---------- 再生 ----------
  const player = {
    sentences: [],
    index: 0,
    rep: 0,
    settings: null,
    itemId: null,
    title: '',
    state: 'idle',
    token: 0,
    timer: null,
    estimator: null,
    gotBoundary: false,
    utterance: null,
    rendered: -1,
    words: [],
    revealedMax: -1,
    nowIdx: -1,
    logEntry: null
  };

  function playItem(item) {
    if (player.itemId === item.id && player.state !== 'idle') {
      togglePlay();
      return;
    }
    const entry = { t: Date.now(), r: item.settings.rate };
    item.playLog.push(entry);
    if (item.playLog.length > 500) item.playLog.splice(0, item.playLog.length - 500);
    item.playCount += 1;
    item.lastPlayedAt = entry.t;
    saveItems();
    startPlayback({ text: item.text, settings: { ...item.settings }, itemId: item.id, title: item.title });
    player.logEntry = entry;
  }

  function startPlayback(opts) {
    if (!synth) {
      toast('このブラウザは読み上げに対応していません');
      return;
    }
    const sentences = splitSentences(opts.text);
    if (!sentences.length) return;
    stopDictation();
    interrupt();
    Object.assign(player, {
      sentences,
      index: 0,
      rep: 0,
      settings: opts.settings,
      itemId: opts.itemId,
      title: opts.title,
      rendered: -1,
      logEntry: null
    });
    $('pTitle').textContent = opts.title;
    renderBar();
    showPlayer(true);
    speakCurrent();
    renderList();
  }

  function clearTimers() {
    clearTimeout(player.timer);
    stopEstimator();
  }

  function interrupt() {
    player.token += 1;
    clearTimers();
    if (synth) synth.cancel();
  }

  function speakCurrent() {
    const token = ++player.token;
    clearTimers();

    if (player.index >= player.sentences.length) {
      if (player.settings.loop) {
        player.index = 0;
        player.rep = 0;
        player.rendered = -1;
      } else {
        finishPlayback();
        return;
      }
    }

    player.state = 'playing';
    if (player.rendered !== player.index) renderSentence();
    updatePlayerUI();
    synth.cancel();

    const text = player.sentences[player.index];
    const u = new SpeechSynthesisUtterance(text);
    const voice = findVoice(player.settings);
    u.lang = voice ? voice.lang : langOf(player.settings.accent);
    if (voice) u.voice = voice;
    u.rate = player.settings.rate;
    player.utterance = u;
    player.gotBoundary = false;
    clearNow();

    u.onstart = () => {
      if (token !== player.token) return;
      startEstimator(token, text.length, player.settings.rate);
    };

    u.onboundary = (e) => {
      if (token !== player.token) return;
      if (e.name && e.name !== 'word') return;
      player.gotBoundary = true;
      stopEstimator();
      reveal(e.charIndex);
    };

    u.onend = () => {
      if (token !== player.token || player.state !== 'playing') return;
      stopEstimator();
      revealAll();
      player.rep += 1;
      if (player.rep >= player.settings.repeat) {
        player.rep = 0;
        player.index += 1;
      }
      player.timer = setTimeout(() => {
        if (token === player.token && player.state === 'playing') speakCurrent();
      }, player.settings.pause * 1000);
    };

    u.onerror = (e) => {
      if (token !== player.token) return;
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      stopEstimator();
      player.state = 'paused';
      updatePlayerUI();
      renderList();
      toast(`読み上げに失敗しました（${e.error}）`);
    };

    player.timer = setTimeout(() => {
      if (token === player.token) synth.speak(u);
    }, 50);
  }

  function startEstimator(token, length, rate) {
    stopEstimator();
    const charsPerSec = 14 * rate;
    const t0 = performance.now();
    player.estimator = setTimeout(function tick() {
      if (token !== player.token || player.gotBoundary) return;
      const ci = Math.floor(((performance.now() - t0) / 1000) * charsPerSec);
      reveal(Math.min(ci, length));
      player.estimator = setTimeout(tick, 80);
    }, 350);
  }

  function stopEstimator() {
    clearTimeout(player.estimator);
    player.estimator = null;
  }

  function renderSentence() {
    const s = player.sentences[player.index];
    const el = $('pSentence');
    let html = '';
    let last = 0;
    s.replace(/\S+/g, (m, offset) => {
      html += escapeHtml(s.slice(last, offset)) + `<span class="w" data-s="${offset}">${escapeHtml(m)}</span>`;
      last = offset + m.length;
      return m;
    });
    html += escapeHtml(s.slice(last));
    el.innerHTML = html;
    el.scrollTop = 0;
    player.words = [...el.querySelectorAll('.w')].map((w) => ({ el: w, start: Number(w.dataset.s) }));
    player.rendered = player.index;
    player.revealedMax = -1;
    player.nowIdx = -1;
  }

  function reveal(charIndex) {
    const words = player.words;
    let k = -1;
    for (let i = 0; i < words.length; i++) {
      if (words[i].start <= charIndex) k = i;
      else break;
    }
    if (k < 0) return;
    for (let i = player.revealedMax + 1; i <= k; i++) words[i].el.classList.add('clear');
    player.revealedMax = Math.max(player.revealedMax, k);
    if (k !== player.nowIdx) {
      if (player.nowIdx >= 0 && words[player.nowIdx]) words[player.nowIdx].el.classList.remove('now');
      words[k].el.classList.add('now');
      player.nowIdx = k;
    }
  }

  function clearNow() {
    if (player.nowIdx >= 0 && player.words[player.nowIdx]) {
      player.words[player.nowIdx].el.classList.remove('now');
    }
    player.nowIdx = -1;
  }

  function revealAll() {
    player.words.forEach((w) => w.el.classList.add('clear'));
    player.revealedMax = player.words.length - 1;
    clearNow();
  }

  function finishPlayback() {
    player.state = 'done';
    player.index = player.sentences.length - 1;
    revealAll();
    updatePlayerUI();
    renderList();
  }

  function togglePlay() {
    if (player.state === 'playing') {
      player.state = 'paused';
      interrupt();
      clearNow();
    } else if (player.state === 'paused') {
      speakCurrent();
    } else if (player.state === 'done') {
      player.index = 0;
      player.rep = 0;
      player.rendered = -1;
      speakCurrent();
    }
    updatePlayerUI();
    renderList();
  }

  function jumpTo(index) {
    if (!player.sentences.length) return;
    const wasIdle = player.state !== 'playing';
    player.index = Math.max(0, Math.min(index, player.sentences.length - 1));
    player.rep = 0;
    speakCurrent();
    if (wasIdle) renderList();
  }

  function stopPlayback() {
    interrupt();
    player.state = 'idle';
    player.itemId = null;
    player.logEntry = null;
    showPlayer(false);
    renderList();
  }

  function showPlayer(on) {
    const p = $('player');
    p.classList.toggle('show', on);
    p.setAttribute('aria-hidden', String(!on));
    document.body.classList.toggle('has-player', on);
    $('pSentence').dataset.mode = prefs.display;
  }

  function renderBar() {
    const bar = $('pBar');
    const n = player.sentences.length;
    bar.classList.toggle('dense', n > 40);
    bar.innerHTML = player.sentences
      .map((_, i) => `<button type="button" data-index="${i}" aria-label="${i + 1}文目"></button>`)
      .join('');
  }

  function updatePlayerUI() {
    const n = player.sentences.length;
    if (!n) return;
    const idx = Math.min(player.index, n - 1);
    const done = player.state === 'done';

    [...$('pBar').children].forEach((seg, i) => {
      seg.classList.toggle('done', done || i < idx);
      seg.classList.toggle('current', !done && i === idx);
    });

    let progress = `${idx + 1} / ${n}`;
    if (player.settings.repeat > 1 && !done) {
      progress += ` · ${player.rep + 1}/${player.settings.repeat}回目`;
    }
    $('pProgress').textContent = progress;

    const playBtn = $('pPlay');
    if (player.state === 'playing') {
      playBtn.innerHTML = ICON.pause;
      playBtn.setAttribute('aria-label', '一時停止');
    } else if (done) {
      playBtn.innerHTML = ICON.replay;
      playBtn.setAttribute('aria-label', '最初から再生');
    } else {
      playBtn.innerHTML = ICON.play;
      playBtn.setAttribute('aria-label', '再生');
    }

    $('pPrev').disabled = idx === 0 && !done;
    $('pNext').disabled = idx >= n - 1;
    $('pRate').textContent = `${fmtRate(player.settings.rate)}x`;
    $('pMode').textContent = MODE_LABEL[prefs.display];
  }

  function cycleRate() {
    const cur = player.settings.rate;
    const next = RATES.find((r) => r > cur + 0.001) ?? RATES[0];
    player.settings.rate = next;

    if (player.itemId) {
      const it = items.find((i) => i.id === player.itemId);
      if (it) {
        it.settings.rate = next;
        if (player.logEntry) player.logEntry.r = next;
        saveItems();
        renderList();
      }
    } else {
      $('rate').value = next;
      onFormChange();
    }

    if (player.state === 'playing') {
      jumpTo(player.index);
    } else {
      updatePlayerUI();
    }
  }

  function cycleMode() {
    prefs.display = MODES[(MODES.indexOf(prefs.display) + 1) % MODES.length];
    savePrefs();
    $('pSentence').dataset.mode = prefs.display;
    updatePlayerUI();
  }

  // ---------- バックアップ ----------
  function exportData() {
    if (!items.length) {
      toast('書き出す英文がありません');
      return;
    }
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const a = document.createElement('a');
    a.href = url;
    a.download = `listening-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`${items.length}件を書き出しました`);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('invalid');
        let added = 0;
        data.forEach((d) => {
          if (d && d.id && d.text && !items.some((i) => i.id === String(d.id))) {
            items.push(normalizeItem(d));
            added += 1;
          }
        });
        saveItems();
        renderList();
        toast(added ? `${added}件を読み込みました` : '新しい英文はありませんでした');
      } catch (e) {
        toast('ファイルを読み込めませんでした。書き出したJSONファイルを選んでください', null, 3600);
      }
    };
    reader.readAsText(file);
  }

  // ---------- 初期化 ----------
  function init() {
    $('btnMic').innerHTML = ICON.mic;
    $('selectChevron').innerHTML = ICON.chevron;
    $('summaryChevron').innerHTML = ICON.chevron;
    $('pClose').innerHTML = ICON.close;
    $('pPrev').innerHTML = ICON.prev;
    $('pNext').innerHTML = ICON.next;

    applyTheme();
    $('btnTheme').addEventListener('click', cycleTheme);

    $('purpose').value = prefs.purpose || '';
    $('purpose').addEventListener('input', (e) => {
      prefs.purpose = e.target.value;
      savePrefs();
    });

    accentSeg = setupSegmented($('accentSeg'), formAccent, (v) => {
      formAccent = v;
      renderVoiceSelect();
      onFormChange();
      if (dictation.active) setMicUI();
    });

    repeatSeg = setupSegmented($('repeatSeg'), formRepeat, (v) => {
      formRepeat = Number(v);
      onFormChange();
    });

    applyFormSettings(settingsFromPrefs());

    if (!synth) {
      $('unsupported').classList.remove('hidden');
    } else {
      loadVoices();
      synth.addEventListener
        ? synth.addEventListener('voiceschanged', loadVoices)
        : (synth.onvoiceschanged = loadVoices);
    }

    if (Recognition) {
      $('btnMic').classList.remove('hidden');
      $('btnMic').addEventListener('click', () => {
        if (dictation.active) stopDictation();
        else startDictation();
      });
    }

    $('voice').addEventListener('change', (e) => {
      formVoice[formAccent] = e.target.value;
      onFormChange();
    });
    ['rate', 'pause'].forEach((id) => $(id).addEventListener('input', onFormChange));
    $('loop').addEventListener('change', onFormChange);
    $('text').addEventListener('input', updateLabels);

    $('btnPreview').addEventListener('click', () => {
      startPlayback({
        text: $('text').value,
        settings: getFormSettings(),
        itemId: null,
        title: $('title').value.trim() || '試聴'
      });
    });
    $('btnSave').addEventListener('click', saveCurrent);
    $('btnCancelEdit').addEventListener('click', resetForm);

    $('list').addEventListener('click', onListClick);
    $('search').addEventListener('input', renderList);

    $('pPlay').addEventListener('click', togglePlay);
    $('pPrev').addEventListener('click', () => {
      jumpTo(player.state === 'done' ? player.sentences.length - 1 : player.index - 1);
    });
    $('pNext').addEventListener('click', () => jumpTo(player.index + 1));
    $('pClose').addEventListener('click', stopPlayback);
    $('pRate').addEventListener('click', cycleRate);
    $('pMode').addEventListener('click', cycleMode);
    $('pBar').addEventListener('click', (e) => {
      const seg = e.target.closest('button[data-index]');
      if (seg) jumpTo(Number(seg.dataset.index));
    });

    const sentenceEl = $('pSentence');
    const peekOn = () => sentenceEl.classList.add('peek');
    const peekOff = () => sentenceEl.classList.remove('peek');
    sentenceEl.addEventListener('pointerdown', peekOn);
    sentenceEl.addEventListener('pointerup', peekOff);
    sentenceEl.addEventListener('pointerleave', peekOff);
    sentenceEl.addEventListener('pointercancel', peekOff);

    $('btnExport').addEventListener('click', exportData);
    $('btnImport').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', (e) => {
      if (e.target.files[0]) importData(e.target.files[0]);
      e.target.value = '';
    });

    document.addEventListener('keydown', (e) => {
      if (!$('player').classList.contains('show')) return;
      const t = e.target;
      const inField = t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
      if (inField) return;
      if (e.code === 'Space' && !(t.closest && t.closest('button'))) {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        jumpTo(player.index - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        jumpTo(player.index + 1);
      } else if (e.key === 'Escape') {
        stopPlayback();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (synth) synth.cancel();
    });

    renderList();
  }

  init();
})();
</script>
</body>
</html>
